<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#fdeff4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nova">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Nova</title>
<style>
/* ───────── Design tokens ───────── */
:root{
  color-scheme: only light;

  /* The one accent token. Change this and the whole app follows. */
  --accent:#ff4d8d;
  --accent-ink:color-mix(in srgb,var(--accent) 70%,#3a0a22);
  --accent-wash:color-mix(in srgb,var(--accent) 12%,#fff);
  --accent-soft:color-mix(in srgb,var(--accent) 24%,#fff);

  --ink:#2b1f27;
  --ink-2:#7d6b76;
  --ink-3:#b5a6af;
  --danger:#e5484d;

  /* spacing scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px; --s7:40px;
  /* radius scale */
  --r-s:10px; --r-m:16px; --r-l:22px; --r-xl:30px; --r-pill:999px;
  /* glass */
  --blur:22px;
  --glass:rgba(255,255,255,.56);
  --glass-strong:rgba(255,255,255,.8);
  --glass-clear:rgba(255,255,255,.34);
  --edge:rgba(255,255,255,.95);
  --hair:rgba(120,50,85,.10);
  /* shadows, tinted so they sit on the pink background */
  --shadow-s:0 1px 1px rgba(125,45,85,.05),0 4px 14px rgba(125,45,85,.07);
  --shadow-m:0 2px 4px rgba(125,45,85,.06),0 10px 28px rgba(125,45,85,.12);
  --shadow-l:0 4px 10px rgba(125,45,85,.08),0 24px 60px rgba(125,45,85,.22);

  --font:system-ui,-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
  --round:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;background:#fdeff4;overscroll-behavior:none}
body{
  min-height:100%;font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.35;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
  overscroll-behavior:none;overflow:hidden;height:100%;
}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* background the glass sits on */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 60% at 0% 0%,color-mix(in srgb,var(--accent) 26%,#fff) 0%,transparent 60%),
    radial-gradient(90% 55% at 100% 18%,#ffe1cf 0%,transparent 62%),
    radial-gradient(110% 60% at 85% 100%,#e9defF 0%,transparent 60%),
    radial-gradient(90% 50% at 0% 90%,color-mix(in srgb,var(--accent) 14%,#fff) 0%,transparent 65%),
    #fdf3f6;
}

.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);
  backdrop-filter:blur(var(--blur)) saturate(1.7);
  border:1px solid var(--edge);
  box-shadow:var(--shadow-m),inset 0 1px 0 rgba(255,255,255,.9);
}

/* ───────── Header ───────── */
.head{
  position:fixed;top:0;left:0;right:0;z-index:5;
  padding:calc(var(--safe-t) + var(--s3)) var(--s4) var(--s3);
  background:linear-gradient(rgba(253,239,244,.86),rgba(253,239,244,.62));
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);
  backdrop-filter:blur(var(--blur)) saturate(1.7);
  border-bottom:1px solid rgba(255,255,255,.7);
}
.head-top{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);min-height:40px}
.title{font-family:var(--round);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.title small{font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-left:6px}
.title-btn{display:flex;align-items:center;gap:6px;text-align:left;min-width:0;border-radius:var(--r-s)}
.title-btn svg{width:18px;height:18px;color:var(--ink-3);flex:none;margin-top:4px;stroke-width:2.6}
.title-btn:active{opacity:.6}
.jump-year{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4)}
.jump-year b{font-family:var(--round);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.jump-year button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.85);border:1px solid #fff;box-shadow:var(--shadow-s)}
.jump-year button:active{transform:scale(.94)}
.jump-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.jump-grid button{padding:16px 0;border-radius:var(--r-m);font-weight:600;font-size:16px;background:rgba(255,255,255,.82);border:1px solid #fff;box-shadow:var(--shadow-s)}
.jump-grid button:active{transform:scale(.96)}
.jump-grid button.now{color:var(--accent-ink);box-shadow:inset 0 0 0 2px var(--accent-soft),var(--shadow-s)}
.jump-grid button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 38%,transparent)}
.today-btn{
  font-weight:600;font-size:14px;color:var(--accent-ink);
  padding:7px 14px;border-radius:var(--r-pill);background:var(--glass-strong);
  border:1px solid var(--edge);box-shadow:var(--shadow-s);flex:none;
}
.head-acts{display:flex;align-items:center;gap:var(--s2);flex:none}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass-strong);border:1px solid var(--edge);box-shadow:var(--shadow-s);color:var(--accent-ink)}
.icon-btn:active{transform:scale(.94)}
.head-row{display:flex;align-items:center;justify-content:space-between;margin-top:var(--s3)}

.seg{display:inline-flex;padding:3px;border-radius:var(--r-pill);background:rgba(120,50,85,.08)}
.seg button{
  font-weight:600;font-size:14px;color:var(--ink-2);
  padding:7px 20px;border-radius:var(--r-pill);min-width:84px;
  transition:background .18s,color .18s,box-shadow .18s;
}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(125,45,85,.12),0 3px 8px rgba(125,45,85,.10)}

.arrows{display:flex;gap:var(--s2)}
.arrows button{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass-strong);border:1px solid var(--edge);box-shadow:var(--shadow-s);color:var(--ink);
}
.arrows button:active,.today-btn:active{transform:scale(.94)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ───────── Main ───────── */
main{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--head-h,calc(var(--safe-t) + 118px)) + var(--s4)) var(--s4) calc(var(--safe-b) + 150px)}
#view.go-next{animation:goNext .2s ease-out}
#view.go-prev{animation:goPrev .2s ease-out}
@keyframes goNext{from{opacity:.2;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes goPrev{from{opacity:.2;transform:translateX(-18px)}to{opacity:1;transform:none}}

/* ───────── Week view ───────── */
.week{display:flex;flex-direction:column;gap:var(--s2)}
.day{
  display:grid;grid-template-columns:52px 1fr;gap:var(--s3);align-items:start;
  padding:var(--s3) var(--s3) var(--s3) var(--s2);
  border-radius:var(--r-l);position:relative;overflow:hidden;
  border:1px solid var(--edge);
  transition:transform .12s;
}
.day:active{transform:scale(.985)}
/* off day: clear, airy glass so anything on it stands out */
.day.off{background:var(--glass-clear);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
/* work day: solid glass, washed with the shift colour, colour rail on the edge */
.day.work{
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 15%,#fff) 0%,rgba(255,255,255,.74) 62%);
  box-shadow:var(--shadow-s),inset 0 1px 0 rgba(255,255,255,.9);
}
.day.work::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}

.day-date{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:1px}
.dow{font-size:12px;font-weight:600;color:var(--ink-2)}
.num{
  font-family:var(--round);font-weight:700;font-size:22px;line-height:1;
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
}
.day.today .num{background:var(--accent);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 45%,transparent)}
.day.today .dow{color:var(--accent-ink)}

.day-body{display:flex;flex-direction:column;gap:var(--s2);min-width:0;padding-top:3px}
.shift{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px var(--s2)}
.shift-name{font-family:var(--round);font-weight:700;font-size:17px;color:color-mix(in srgb,var(--c) 62%,#2b1f27)}
.shift-time{font-size:14px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
.off-label{font-size:15px;font-weight:500;color:var(--ink-3);padding-top:6px}

.ev{display:grid;grid-template-columns:8px 1fr;gap:0 var(--s2);align-items:start;border-radius:var(--r-s)}
.ev::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;grid-row:1}
.ev-title{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.ev-meta{grid-column:2;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ev-notes{grid-column:2;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:1px}
.rep{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-left:5px;color:var(--ink-3)}
.rep svg{width:12px;height:12px;stroke-width:2.6}

.day.off .ev-title{color:var(--ink)}
.day.off:has(.ev){background:var(--glass);box-shadow:var(--shadow-s),inset 0 1px 0 rgba(255,255,255,.9)}

/* paint feedback */
.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.015)}100%{transform:none}}
body.painting .day,body.painting .cell{cursor:copy}

/* coming up */
.next{margin-top:var(--s6);padding:0 var(--s1)}
.next h2{font-family:var(--round);font-size:15px;font-weight:700;color:var(--ink-2);margin-bottom:var(--s2)}
.next-row{display:grid;grid-template-columns:92px 1fr;gap:var(--s3);padding:9px 0;border-top:1px solid var(--hair);font-size:14.5px}
.next-row span:first-child{color:var(--ink-2);font-variant-numeric:tabular-nums}
.next-row b{font-weight:600;overflow-wrap:anywhere}
.next-row i{font-style:normal;color:var(--ink-2);font-weight:400}

/* first-run card */
.hello{border-radius:var(--r-l);padding:var(--s5);margin-bottom:var(--s4)}
.hello h2{font-family:var(--round);font-size:20px;font-weight:700;margin-bottom:4px}
.hello p{color:var(--ink-2);font-size:15px;margin-bottom:var(--s4)}

/* ───────── Month view ───────── */
.mhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.mhead span{text-align:center;font-size:12px;font-weight:600;color:var(--ink-2)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{
  min-height:72px;border-radius:14px;padding:5px 3px 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:var(--glass-clear);border:1px solid rgba(255,255,255,.8);
}
.cell.work{background:var(--glass-strong);box-shadow:var(--shadow-s)}
.cell.out{opacity:.36}
.cell:active{transform:scale(.94)}
.cell .n{font-family:var(--round);font-weight:600;font-size:14px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.cell.today .n{background:var(--accent);color:#fff;font-weight:700}
.chip-s{
  width:calc(100% - 2px);text-align:center;border-radius:7px;padding:2px 0;
  font-family:var(--round);font-weight:700;font-size:11.5px;line-height:1.3;
  background:color-mix(in srgb,var(--c) 24%,#fff);color:color-mix(in srgb,var(--c) 58%,#2b1f27);
}
.chip-s.none{background:none;color:transparent}
.dots{display:flex;gap:3px;align-items:center;height:7px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dots em{font-style:normal;font-size:9px;font-weight:700;color:var(--accent-ink);line-height:1}

/* ───────── Dock ───────── */
.dock-wrap{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 var(--s4) calc(var(--safe-b) + var(--s3));pointer-events:none}
.dock,.tray{background:rgba(255,255,255,.74)}
.dock{
  pointer-events:auto;margin:0 auto;max-width:360px;border-radius:var(--r-xl);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 10px;
  box-shadow:var(--shadow-l),inset 0 1px 0 rgba(255,255,255,.9);
}
.dock-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:11.5px;font-weight:600;color:var(--ink-2);border-radius:var(--r-m)}
.dock-btn svg{width:23px;height:23px;color:var(--ink)}
.dock-btn:active{background:rgba(120,50,85,.07)}
.add-btn{
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;margin:0 var(--s2);
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 78%,#fff),var(--accent));
  box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.5);
}
.add-btn svg{width:26px;height:26px;stroke-width:2.6}
.add-btn:active{transform:scale(.93)}

/* paint tray */
.tray{pointer-events:auto;margin:0 auto;max-width:420px;border-radius:var(--r-xl);padding:var(--s3) var(--s3) var(--s3);box-shadow:var(--shadow-l),inset 0 1px 0 rgba(255,255,255,.9)}
.tray-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:0 var(--s1) var(--s3) var(--s2)}
.tray-top span{font-family:var(--round);font-weight:700;font-size:16px;white-space:nowrap}
.tray-chips{display:flex;gap:var(--s2);overflow-x:auto;padding:3px;margin:-3px;scrollbar-width:none}
.tray-chips::-webkit-scrollbar{display:none}

.chip{
  flex:none;display:inline-flex;align-items:center;gap:7px;
  padding:9px 14px 9px 10px;border-radius:var(--r-pill);font-weight:600;font-size:15px;
  background:rgba(255,255,255,.8);border:1px solid var(--edge);box-shadow:var(--shadow-s);
}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.chip.clear i{background:none;border:2px dashed var(--ink-3)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--ink-3)) 20%,#fff);box-shadow:0 0 0 2px var(--c,var(--ink-2)),var(--shadow-s)}

/* ───────── Buttons ───────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  padding:11px 18px;border-radius:var(--r-pill);font-weight:600;font-size:16px;
}
.btn:active{transform:scale(.97)}
.btn.primary{color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.quiet{color:var(--accent-ink);background:var(--accent-wash)}
.btn.danger{color:var(--danger);background:rgba(229,72,77,.09)}
.btn.small{padding:8px 16px;font-size:15px}
.btn.wide{width:100%}

/* ───────── Sheets ───────── */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(60,20,40,.22);opacity:0;transition:opacity .22s}
.scrim.open{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:11;
  max-height:calc(100dvh - var(--safe-t) - 28px);overflow-y:auto;overscroll-behavior:contain;
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  background:rgba(255,246,250,.9);
  -webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  border-top:1px solid #fff;box-shadow:var(--shadow-l);
  padding:var(--s2) var(--s4) calc(var(--safe-b) + var(--s5));
  transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.85,.25,1);
}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(120,50,85,.18);margin:0 auto var(--s3)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
.sheet-head h2{font-family:var(--round);font-weight:700;font-size:22px;letter-spacing:-.01em}
.link{color:var(--accent-ink);font-weight:600;font-size:16px;padding:6px 2px}
.sub{font-size:13.5px;font-weight:600;color:var(--ink-2);margin:var(--s5) var(--s1) var(--s2)}
.sub:first-of-type{margin-top:0}
.chips-wrap{display:flex;flex-wrap:wrap;gap:var(--s2)}
.empty{color:var(--ink-2);font-size:15px;padding:var(--s2) var(--s1)}

.group{background:rgba(255,255,255,.82);border:1px solid #fff;border-radius:var(--r-m);box-shadow:var(--shadow-s);overflow:hidden}
.group + .group{margin-top:var(--s3)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:50px;padding:6px var(--s4);border-top:1px solid var(--hair)}
.row:first-child{border-top:0}
.row > label,.row > .lbl{font-size:16px;flex:none}
.row input[type=text],.row select{border:0;background:none;text-align:right;flex:1;min-width:0;outline:none;height:38px;font-size:16px}
.row input[type=date],.row input[type=time]{border:0;background:rgba(120,50,85,.07);border-radius:9px;padding:6px 10px;font-size:16px;min-height:36px;outline:none}
.row select{-webkit-appearance:none;appearance:none;color:var(--accent-ink);font-weight:600;direction:rtl}
.row.title-row input{text-align:left;font-size:19px;font-weight:600;font-family:var(--round)}
.row.title-row input::placeholder,textarea::placeholder{color:var(--ink-3)}
.row.bad{background:rgba(229,72,77,.08)}
textarea{display:block;width:100%;min-height:76px;border:0;background:none;resize:none;outline:none;padding:var(--s3) var(--s4);font-size:16px}
.hint{font-size:13px;color:var(--ink-2);margin:var(--s2) var(--s1) 0}
.actions{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s5)}

.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0}
.switch span{position:absolute;inset:0;border-radius:var(--r-pill);background:rgba(120,50,85,.16);transition:background .18s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .18s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}

/* day sheet event list */
.list-ev{display:grid;grid-template-columns:8px 1fr auto;gap:0 var(--s3);align-items:start;width:100%;text-align:left;padding:var(--s3) var(--s4);border-top:1px solid var(--hair)}
.list-ev:first-child{border-top:0}
.list-ev::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px}
.list-ev svg{color:var(--ink-3);margin-top:2px;width:16px;height:16px}

/* my shifts */
.preset{display:grid;grid-template-columns:30px 44px 1fr auto;gap:var(--s2) 10px;align-items:center;padding:10px var(--s3) 10px 6px;border-top:1px solid var(--hair);background:rgba(255,255,255,.01);transition:transform .16s}

.intro{font-size:15px;color:var(--ink-2);margin:calc(var(--s2) * -1) var(--s1) var(--s4)}

.move{display:flex;gap:2px}

.move button:active{background:rgba(120,50,85,.08)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:var(--s3) var(--s4)}
.swatch{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.14)}

.row-val{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:15px}

.seg.sm button{padding:6px 14px;min-width:0;font-size:14px}

/* paint review */
.tray-acts{display:flex;gap:var(--s2)}
.btn:disabled{opacity:.4}
.review{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(60,20,40,.28);padding:calc(var(--safe-t) + var(--s5)) var(--s5) calc(var(--safe-b) + var(--s5))}
.review-card{width:100%;max-width:380px;max-height:100%;display:flex;flex-direction:column;border-radius:var(--r-xl);background:#fffafc;box-shadow:var(--shadow-l);padding:var(--s5);animation:rise .2s ease-out}

.review-sum{color:var(--ink-2);font-size:14.5px;margin:2px 0 var(--s3)}
.review-list{overflow-y:auto;overscroll-behavior:contain;margin:0 calc(var(--s2) * -1);padding:0 var(--s2)}
.review-row{display:grid;grid-template-columns:96px 1fr;gap:var(--s3);padding:10px 0;border-top:1px solid var(--hair);font-size:15px;align-items:baseline}
.review-row span{color:var(--ink-2);font-variant-numeric:tabular-nums}
.review-row b{font-weight:600;overflow-wrap:anywhere}
.review-row b i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:7px}

.review-acts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s4)}

.share-img{display:block;width:100%;border-radius:var(--r-l);box-shadow:var(--shadow-m);-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}

/* chooser */
.ask{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(60,20,40,.28);padding:var(--s3) var(--s3) calc(var(--safe-b) + var(--s3))}

@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

.ask-card button.cancel{color:var(--ink-2);font-weight:500}

/* ───────── Together ─────────
   Everything here is tg- prefixed so it can't collide with the calendar's classes. */
:root{

.tg-pull{position:fixed;left:50%;top:calc(var(--head-h) + 8px);z-index:4;transform:translate(-50%,-6px);opacity:0;pointer-events:none;

.tg-banner{font-size:14px;color:var(--ink-2);background:rgba(255,255,255,.66);border:1px solid var(--edge);border-radius:var(--r-m);padding:10px 14px;margin-bottom:var(--s3)}

.tg-hero{border-radius:var(--r-xl);padding:var(--s5) var(--s4) var(--s4);cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.82),rgba(255,255,255,.58));}
.tg-hero:active{transform:scale(.99)}

.tg-hero-k{font-size:14px;font-weight:600;color:var(--accent-ink)}

.tg-hero-sub{color:var(--ink-2);font-size:15px;margin-top:6px}
.tg-hero-when{display:flex;align-items:center;gap:var(--s2);font-size:17px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:var(--s4)}

/* timeline */
.tg-tl{display:grid;grid-template-columns:1fr;gap:0 8px;align-items:start}

.tg-tl-names{display:flex;flex-direction:column;gap:6px;padding-top:1px}

.tg-tl-names span:first-child{color:color-mix(in srgb,var(--tg-me) 70%,#3a0a22)}
.tg-tl-names span:last-child{color:color-mix(in srgb,var(--tg-them) 70%,#1e1550)}
.tg-tl-body{min-width:0}
.tg-tl-track{position:relative;display:flex;flex-direction:column;gap:6px}

.tg-blk{position:absolute;top:0;bottom:0}

.tg-band{position:absolute;top:-3px;bottom:-3px;border-radius:6px;background:var(--tg-free-wash);box-shadow:inset 0 0 0 1.5px rgba(47,185,133,.55)}

.tg-ticks{position:relative;height:16px;margin-top:5px}

.tg-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:var(--s3);font-size:12px;color:var(--ink-2)}

.tg-key{width:14px;height:9px;border-radius:3px;display:inline-block}

.tg-chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s4) 0 var(--s2)}

.tg-row{display:grid;grid-template-columns:44px 1fr;gap:var(--s3);align-items:start;width:100%;text-align:left;
  padding:var(--s3) var(--s4) var(--s3) var(--s3);border-radius:var(--r-l);background:rgba(255,255,255,.62);border:1px solid var(--edge);box-shadow:var(--shadow-s)}
.tg-row:active{transform:scale(.985)}
.tg-k-full{background:linear-gradient(90deg,rgba(47,185,133,.14),rgba(255,255,255,.7) 65%)}
.tg-row-date{display:flex;flex-direction:column;align-items:center;gap:1px}
.tg-row-date small{font-size:12px;font-weight:600;color:var(--ink-2)}

.tg-row-main{display:flex;flex-direction:column;gap:2px;min-width:0}

.tg-row-top b{font-family:var(--round);font-weight:700;font-size:16.5px}
.tg-k-full .tg-row-top b{color:#18825c}
.tg-row-time{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tg-row-time i{font-style:normal;color:var(--ink-3)}
.tg-row .tg-tl{margin-top:8px}

.tg-foot{margin-top:var(--s6);padding:0 var(--s1);font-size:13.5px;color:var(--ink-2)}
.tg-foot p{margin-bottom:6px}
.tg-foot-acts{display:flex;flex-wrap:wrap;align-items:center;gap:2px var(--s4);margin-top:var(--s2)}
.tg-foot-acts .link{font-size:14px}

/* day sheet */
.tg-day-tl{padding:var(--s4)}
.tg-cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s5)}
.tg-col h3{font-family:var(--round);font-size:15px;font-weight:700;margin:0 var(--s1) var(--s2)}
.tg-col-me h3{color:color-mix(in srgb,var(--tg-me) 70%,#3a0a22)}
.tg-col-them h3{color:color-mix(in srgb,var(--tg-them) 70%,#1e1550)}
.tg-col ul{list-style:none;background:rgba(255,255,255,.82);border:1px solid #fff;border-radius:var(--r-m);box-shadow:var(--shadow-s);overflow:hidden}
.tg-li{display:flex;flex-direction:column;gap:1px;padding:10px 12px 10px 24px;border-top:1px solid var(--hair);position:relative;font-size:14px}
.tg-li:first-child{border-top:0}
.tg-li::before{content:"";position:absolute;left:10px;top:15px;width:8px;height:8px;border-radius:50%}
.tg-col-me .tg-li{--c:var(--tg-me)}
.tg-col-them .tg-li{--c:var(--tg-them)}
.tg-li-work::before,.tg-li-plan::before{background:var(--c)}

.tg-li b{font-weight:600;overflow-wrap:anywhere}
.tg-li span{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tg-col-none{font-size:14px;color:var(--ink-3);padding:var(--s2) var(--s1)}

/* settings */
.tg-hours{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--ink-2)}
.tg-hours select{flex:none;width:auto;direction:ltr;text-align:right}
.row select[data-tgset]{direction:ltr;text-align:right;text-align-last:right}
.tg-wide{display:flex;width:100%}
.tg-wide button{flex:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

<body>
<div class="bg"></div>

<header class="head">
  <div class="head-top">
    <button class="title-btn" data-act="jump" aria-label="Jump to a month"><h1 class="title" id="title"></h1><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="head-acts"><button class="today-btn" id="todayBtn" data-act="today" hidden>Today</button><button class="icon-btn" data-act="share" aria-label="Share a picture of this"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 007.5 21h9a2.5 2.5 0 002.5-2.5V12"/></svg></button></div>
  </div>
  <div class="head-row">
    <div class="seg" role="group" aria-label="View">
      <button data-act="view" data-v="week">Week</button>
      <button data-act="view" data-v="month">Month</button>

      <button data-act="prev" aria-label="Previous"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button data-act="next" aria-label="Next"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
</header>

<main><div id="view"></div></main>

<div class="dock-wrap" id="dock"></div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="review" id="review" hidden></div>
<div class="ask" id="ask" hidden></div>

<script>
'use strict';
/* ═════════ Nova 7 ═════════
   Local-first: everything draws from localStorage. All writes go through save(),
   which is the single place background sync will hook into later. */

/* ───────── Storage ───────── */
const KEY = 'nova:v1';
const blank = () => ({
  shiftTypes: [],            // {id,name,label,start_time,end_time,color,position,created_at}
  shifts: {},                // { 'YYYY-MM-DD': shiftTypeId }  (one shift per day)
  events: [],                // {id,title,date,start_time,end_time,all_day,notes,repeat,repeat_until,created_at}
  skips: [],                 // {event_id,date}
  settings: { view: 'week', weekStart: 0 }
});
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    const d = JSON.parse(raw), b = blank();
    return { ...b, ...d, settings: { ...b.settings, ...(d.settings || {}) } };
  } catch (e) { return blank(); }
}
let db = load();
let skipSet = new Set();
function reindex() { skipSet = new Set(db.skips.map(s => s.event_id + '|' + s.date)); }
function persist() {
  reindex();
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { console.warn('Nova: could not save', e); }
}
function save() {
  persist();
  dirtySeq++;
  queueSync();
}
reindex();

/* ───────── Dates ───────── */
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const utc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const dayDiff = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
const todayStr = () => ds(new Date());
const weekStartOf = s => addDays(s, -((pd(s).getDay() - db.settings.weekStart + 7) % 7));
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MON_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function fmtTime(t, withMer = true) {
  if (!t) return '';
  let [h, m] = t.split(':').map(Number);
  const mer = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + pad(m) + (withMer ? ' ' + mer : '');
}
const isPM = t => Number(t.split(':')[0]) >= 12;
function fmtRange(a, b) {
  if (!a) return '';
  if (!b) return fmtTime(a);
  const sameHalf = isPM(a) === isPM(b) && b > a;
  return fmtTime(a, !sameHalf) + ' – ' + fmtTime(b);
}
const overnight = t => t.start_time && t.end_time && t.end_time <= t.start_time;
const shiftRange = t => fmtRange(t.start_time, t.end_time) + (overnight(t) ? ' next day' : '');

/* ───────── Helpers ───────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const typeById = id => db.shiftTypes.find(t => t.id === id);
const shiftOn = date => { const id = db.shifts[date]; return id ? typeById(id) : null; };
const sortedTypes = () => [...db.shiftTypes].sort((a, b) => a.position - b.position);

const ICON = {
  repeat: '<svg class="i" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/></svg>',
  brush: '<svg class="i" viewBox="0 0 24 24"><path d="M20.5 3.5a2.1 2.1 0 00-3 0l-7.6 8 2.6 2.6 8-7.6a2.1 2.1 0 000-3z"/><path d="M8.6 13.2c-2.2.1-3.6 1.5-3.8 3.5-.1 1.3-.8 2.2-1.8 2.6 3.3 1.3 7.4.3 7.9-3.3"/></svg>',
  list: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  chev: '<svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  up: '<svg class="i" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
  grip: '<svg class="i" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"/></svg>',
  down: '<svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>'
};
const COLORS = ['#ff5c8a', '#ff7a59', '#f5a524', '#34c38f', '#22b8cf', '#4c8dff', '#8b6cff', '#c05cff', '#7a8194'];

/* ───────── Events ───────── */
function occursOn(ev, date) {
  if (date < ev.date) return false;
  if (!ev.repeat || ev.repeat === 'none') return date === ev.date;
  if (ev.repeat_until && date > ev.repeat_until) return false;
  if (skipSet.has(ev.id + '|' + date)) return false;
  const n = dayDiff(ev.date, date);

      to = Math.round((from * h + dy) / h);
      rows.forEach((r, i) => {
        if (r === row) return;
        r.style.transform = (i > from && i <= to) ? `translateY(${-h}px)` : (i < from && i >= to) ? `translateY(${h}px)` : '';

    };
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);

/* Turns Nova's tables into the shared schedule format both apps speak.
   This exact block lives in api/share.js (what Joe's Glance receives) and in index.html

};

function togetherHTML() {
  let h = `<div class="tg-pull" id="tgPull" aria-hidden="true">${tg.loading ? 'Updating…' : 'Pull to refresh'}</div>`;
  if (!sync.code) {
    const [t, p] = TG_STATES.nobackup;
    return h + `<section class="tg-state glass"><h2>${t}</h2><p>${p}</p><button class="btn primary" data-act="backup">Turn on backup</button></section>`;
  }
  if (!tg.data) {
    if (tg.loading || !tg.err) return h + `<section class="tg-state glass tg-loading"><h2>Checking ${'Joe'}’s schedule…</h2><div class="tg-skel"></div><div class="tg-skel tg-skel-s"></div></section>`;
    const [t, p] = TG_STATES[tg.err] || TG_STATES.bad_answer;
    return h + `<section class="tg-state glass"><h2>${t}</h2><p>${p}</p><button class="btn quiet" data-act="tg-refresh">Try again</button></section>` + tgFooter(null);
  }
  const P = tgCompute(), res = P.res, joe = P.joe;

  if (tg.err) {
    const [t] = TG_STATES[tg.err] || TG_STATES.bad_answer;
    h += `<div class="tg-banner"><b>${t}.</b> Showing ${esc(joe)}’s schedule from ${tgAgo(tg.at)}.</div>`;
  }

  // hero
  const N = res.next;
  if (N) {
    h += `<section class="tg-hero glass" data-tg-day="${N.key}">
      <p class="tg-hero-k">Next time you’re both free</p>
      <h2 class="tg-hero-day">${tgDay(N.key, true)}</h2>
      <p class="tg-hero-when"><span>${tgRange2(N.a, N.b)}</span><b class="tg-len">${tgLen(N.len)}</b></p>
      ${tgTimeline(N, true, joe)}
      ${TG_LEGEND}
    </section>`;
  } else {
    h += `<section class="tg-hero glass tg-hero-none">
      <p class="tg-hero-k">Next time you’re both free</p>
      <h2 class="tg-hero-day">Nothing in the next ${P.o.weeks} weeks</h2>
      <p class="tg-hero-sub">No stretch of ${P.o.minH} hours lines up for both of you. A shorter hang or wider hang hours in Together settings may find one.</p>
    </section>`;
  }

  // summary chips
  const stretches = res.days.filter(D => D.kind === 'free').reduce((n, D) => n + D.segs.length, 0);
  const chips = [];
  if (res.counts.full) chips.push(`${res.counts.full} ${res.counts.full === 1 ? 'day' : 'days'} off together`);
  if (stretches) chips.push(`${stretches} free ${stretches === 1 ? 'stretch' : 'stretches'}`);
  if (chips.length) h += `<div class="tg-chips">${chips.map(c => `<span class="tg-chip">${c}</span>`).join('')}</div>`;

  // rows grouped by week
  const shown = res.days.filter(D => D.kind === 'full' || D.kind === 'free');
  const thisWeek = weekStartOf(todayStr());
  let curWeek = null;
  for (const D of shown) {
    const ws = weekStartOf(D.key);
    if (ws !== curWeek) {
      if (curWeek) h += '</div></section>';
      curWeek = ws;
      const a = pd(ws), b = pd(addDays(ws, 6));
      const name = ws === thisWeek ? 'This week' : ws === addDays(thisWeek, 7) ? 'Next week'
        : a.getMonth() === b.getMonth() ? `${MON[a.getMonth()]} ${a.getDate()} – ${b.getDate()}` : `${MON[a.getMonth()]} ${a.getDate()} – ${MON[b.getMonth()]} ${b.getDate()}`;
      h += `<section class="tg-week"><h3>${name}</h3><div class="tg-rows">`;
    }
    const d = pd(D.key), more = D.kind === 'free' && D.segs.length > 1 ? ` <i>+${D.segs.length - 1} more</i>` : '';
    h += `<button class="tg-row tg-k-${D.kind}" data-tg-day="${D.key}">
      <span class="tg-row-date"><small>${D.key === todayStr() ? 'Today' : DOW[d.getDay()]}</small><b>${d.getDate()}</b></span>
      <span class="tg-row-main">
        <span class="tg-row-top"><b>${tgLabel(D)}</b><span class="tg-len">${tgLen(D.len)}</span></span>
        <span class="tg-row-time">${tgRange2(D.a, D.b)}${more}</span>
        ${tgTimeline(D, false, joe)}
      </span>
    </button>`;
  }
  if (curWeek) h += '</div></section>';
  return h + tgFooter(P);
}

function tgFooter(P) {
  let f = '';
  if (P) {
    if (P.themThrough && P.themThrough < P.last) f += `<p>${esc(P.joe)}’s one-off shifts are on the calendar through ${tgShortDate(P.themThrough)}.</p>`;
    if (P.meThrough && P.meThrough < P.last) f += `<p>Your shifts are filled in through ${tgShortDate(P.meThrough)}. Paint more to see further.</p>`;
    if (!P.meThrough) f += `<p>None of your shifts are painted yet, so every day counts as off for you.</p>`;
  }
  const upd = tg.loading ? 'Updating…' : tg.at ? `Updated ${tgAgo(tg.at)}` : '';
  return `<footer class="tg-foot">${f}
    <div class="tg-foot-acts">${upd ? `<span>${upd}</span>` : ''}<button class="link" data-act="tg-refresh">Refresh</button><button class="link" data-act="tg-settings">Together settings</button></div>
  </footer>`;
}

/* one day, in detail */
function openTgDay(key) {
  const P = tg.plan; if (!P) return;
  const D = P.res.days.find(x => x.key === key); if (!D) return;
  ctx = { kind: 'tgday', key };
  const d = pd(key), day0 = D.day, day1 = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
  const whoList = (items, who) => {
    const list = items.filter(x => {
      if (x.allDay) { const s = new Date(x.s); return new Date(s.getFullYear(), s.getMonth(), s.getDate()).getTime() <= day0 && x.e > day0; }
      return x.s < day1 && x.e > day0;
    });
    const sleep = (D.busy[who] || []).filter(b => b.kind === 'sleep');
    let li = list.map(x => {
      const when = x.allDay ? '' : x.s < day0 ? `Until ${fmtTime(tgHM(x.e))}` : x.e > day1 ? `${tgRange2(x.s, x.e)} next day` : tgRange2(x.s, x.e);
      return `<li class="tg-li tg-li-${x.kind}"><b>${esc(x.title)}</b>${when ? `<span>${when}</span>` : ''}</li>`;
    }).join('');
    li += sleep.map(b => `<li class="tg-li tg-li-sleep"><b>Sleeping</b><span>Until ${fmtTime(tgHM(b.b))}</span></li>`).join('');
    return li ? `<ul>${li}</ul>` : `<p class="tg-col-none">Nothing on</p>`;
  };
  const free = D.kind === 'none' || D.kind === 'unknown' ? '' : `
    <div class="sub">Free together</div>
    <div class="group">${D.segs.map(g => `<div class="row"><span class="lbl">${tgRange2(g[0], g[1])}</span><span class="row-val">${tgLen(g[1] - g[0])}</span></div>`).join('')}</div>
`;
  openSheet(`
    <div class="sheet-head"><h2>${DOW_LONG[d.getDay()]}, ${MON_LONG[d.getMonth()]} ${d.getDate()}</h2><button class="link" data-act="close">Done</button></div>
    <p class="intro">${D.kind === 'full' || D.kind === 'free' ? `${tgLabel(D)}, ${tgLen(D.len)}` : 'No shared free time this day'}</p>
    <div class="group tg-day-tl">${tgTimeline(D, true, P.joe)}${TG_LEGEND}</div>
    ${free}
    <div class="tg-cols">
      <div class="tg-col tg-col-me"><h3>${esc(ME_NAME)}</h3>${whoList(P.me, 'me')}</div>
      <div class="tg-col tg-col-them"><h3>${esc(P.joe)}</h3>${whoList(P.them, 'them')}</div>
    </div>`);
}

/* settings */
function openTgSettings() {
  const back = sheetOpen && (ctx.kind === 'shifts' || (ctx.kind === 'tgset' && ctx.backToShifts));
  ctx = { kind: 'tgset', backToShifts: back };
  const o = tgOpt(), untimed = sortedTypes().filter(tgUntimed);
  const seg = (k, vals, fmt) => `<div class="seg sm">${vals.map(v => `<button data-act="tg-set" data-k="${k}" data-v="${v}" aria-pressed="${o[k] === v}">${fmt(v)}</button>`).join('')}</div>`;
  const hr = h => h === 24 ? 'Midnight' : h === 12 ? 'Noon' : `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`;
  const opts = (vals, cur, fmt) => vals.map(v => `<option value="${v}"${v === cur ? ' selected' : ''}>${fmt(v)}</option>`).join('');
  openSheet(`
    <div class="sheet-head"><h2>Together</h2><button class="link" data-act="tg-settings-close">Done</button></div>
    <p class="intro">Together lines up your schedule with ${esc((tg.data && tg.data.name) || 'Joe')}’s and finds the times you’re both free.</p>
    <div class="group">
      <div class="row"><span class="lbl">Share my schedule with Joe</span><label class="switch"><input type="checkbox" data-tgset="share" ${db.settings.shareOn !== false ? 'checked' : ''} aria-label="Share my schedule with Joe"><span></span></label></div>
    </div>
    <p class="hint">${sync.code ? 'Joe sees your shifts and the names and times of your plans. Notes stay private.' : 'Sharing needs backup on.'}</p>
    <div class="sub">Finding free time</div>
    <div class="group">
      <div class="row"><span class="lbl">Look ahead</span>${seg('weeks', [2, 4, 6], v => v + ' wk')}</div>
      <div class="row"><span class="lbl">Shortest hang</span>${seg('minH', [2, 3, 4], v => v + 'h')}</div>
      <div class="row"><span class="lbl">Hang hours</span><span class="tg-hours">
        <select data-tgset="h0" aria-label="Hang hours start">${opts([6, 7, 8, 9, 10, 11, 12], o.h0, hr)}</select><span>to</span>
        <select data-tgset="h1" aria-label="Hang hours end">${opts([18, 19, 20, 21, 22, 23, 24], o.h1, hr)}</select></span></div>
      <div class="row"><label for="tg-sleep">Up after a night shift</label><select id="tg-sleep" data-tgset="sleep">${opts([0, 11, 12, 13, 14, 15, 16], o.sleep, v => v ? hr(v) : 'Off')}</select></div>
    </div>
    <p class="hint">Anything on either calendar blocks that time. Day notes, like pay day, don\u2019t. After an overnight shift, whoever worked it counts as asleep until the time above.</p>
    ${untimed.length ? `<div class="sub">Shifts with no set time</div>
    <div class="group">${untimed.map(t => `<div class="row"><span class="lbl">${esc(t.name)}</span><div class="seg sm">
      <button data-act="tg-type" data-id="${t.id}" data-v="work" aria-pressed="${tgMode(t) === 'work'}">Work all day</button>
      <button data-act="tg-type" data-id="${t.id}" data-v="ignore" aria-pressed="${tgMode(t) === 'ignore'}">Ignore</button></div></div>`).join('')}</div>
    <p class="hint">Work all day counts the whole day as busy. Ignore leaves it out, like a pay day.</p>` : ''}`);
}
function tgSet(k, v) {
  const o = tgOpt();
  o[k] = v;
  if (o.h1 - o.h0 < o.minH) { if (k === 'h0') o.h1 = Math.min(24, o.h0 + o.minH); else if (k === 'h1') o.h0 = Math.max(0, o.h1 - o.minH); else o.minH = Math.min(o.minH, o.h1 - o.h0); }
  db.settings.tg = o;
  persist();                      // these stay on this phone; nothing for Supabase
  if (ui.view === 'together') render();
  openTgSettings();
  tgMaybeFetch();
}

/* ───────── Navigation ───────── */
function step(dir) {
  if (ui.view === 'together') return;
  if (ui.view === 'week') ui.anchor = addDays(ui.anchor, 7 * dir);
  else { const a = pd(ui.anchor); ui.anchor = ds(new Date(a.getFullYear(), a.getMonth() + dir, 1)); }
  render(dir);
  $('main').scrollTop = 0;
}
function goToday() {
  const t = todayStr(), dir = t > ui.anchor ? 1 : -1;
  ui.anchor = t; render(dir); $('main').scrollTop = 0;
}
function setView(v) {
  if (v === ui.view) return;
  // coming back from a month you browsed to: land on today if it's in that month, else its first week
  if (v === 'week' && ui.anchor.slice(0, 7) === todayStr().slice(0, 7)) ui.anchor = todayStr();
  ui.view = v; db.settings.view = v; save(); render(); $('main').scrollTop = 0;
  tgMaybeFetch();
}

/* ───────── Input wiring ───────── */
document.addEventListener('click', e => {
  const actEl = e.target.closest('[data-act]');
  if (actEl) {
    const d = actEl.dataset;
    switch (d.act) {
      case 'view': setView(d.v); break;
      case 'prev': step(-1); break;
      case 'next': step(1); break;
      case 'today': goToday(); break;
      case 'jump': if (ui.view !== 'together') openJump(); break;
      case 'jump-year': openJump(Number(d.y)); break;
      case 'jump-month': jumpTo(ctx.year, Number(d.m)); break;
      case 'jump-today': closeSheet(); goToday(); break;
      case 'paint': startPaint(); break;
      case 'paint-pick': ui.paint.id = d.id; ui.lastPaint = d.id; renderDock(); break;
      case 'paint-undo': undoPaint(); break;
      case 'paint-done': finishPaint(); break;
      case 'paint-back': $('#review').hidden = true; break;
      case 'paint-confirm': confirmPaint(); break;
      case 'share': if (ui.view !== 'together') shareImage(); break;
      case 'tg-refresh': tgFetch(); break;
      case 'tg-settings': openTgSettings(); break;
      case 'tg-settings-close': if (ctx.backToShifts) openShifts(); else closeSheet(); break;
      case 'tg-set': tgSet(d.k, Number(d.v)); break;
      case 'tg-type': { const t = typeById(d.id); if (t) { t.together = d.v; save(); render(); openTgSettings(); } break; }
      case 'shift-tg': ctx.tg = d.v; sheet.querySelectorAll('[data-act="shift-tg"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === d.v))); break;
      case 'add-event': openEvent(null, null, d.date || null); break;
      case 'shifts': ui.paint = null; render(); openShifts(); break;
      case 'close': closeSheet(); break;
      case 'cancel-form': if (ctx.back) openDay(ctx.back); else closeSheet(); break;
      case 'save-event': saveEvent(); break;
      case 'delete-event': deleteEvent(); break;
      case 'day-shift': if (d.id) db.shifts[ctx.date] = d.id; else delete db.shifts[ctx.date]; save(); render(); openDay(ctx.date); break;
      case 'edit-shift': openShiftForm(d.id || null); break;
      case 'save-shift': saveShift(); break;
      case 'delete-shift': deleteShift(); break;
      case 'pick-color': ctx.color = d.c; sheet.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', String(s.dataset.c === d.c))); break;
      case 'backup': openBackup(); break;
      case 'backup-close': if (ctx.backToShifts) openShifts(); else closeSheet(); break;
      case 'backup-save': saveBackup(); break;
      case 'backup-off': backupOff(); break;
      case 'week-start': db.settings.weekStart = Number(d.v); save(); render(); openShifts(); break;
    }
    return;
  }
  const tgEl = e.target.closest('[data-tg-day]');
  if (tgEl) { openTgDay(tgEl.dataset.tgDay); return; }
  const dayEl = e.target.closest('#view [data-date]');
  if (dayEl && ui.paint) { paintDay(dayEl.dataset.date); return; }
  const evEl = e.target.closest('[data-ev]');
  if (evEl) { openEvent(evEl.dataset.ev, evEl.dataset.occ); return; }
  if (dayEl) { openDay(dayEl.dataset.date); return; }
});
scrim.addEventListener('click', closeSheet);
sheet.addEventListener('change', e => {
  syncEventForm(); syncShiftForm();
  const k = e.target.dataset && e.target.dataset.tgset;
  if (k === 'share') { db.settings.shareOn = e.target.checked; save(); }
  else if (k) tgSet(k, Number(e.target.value));
});
sheet.addEventListener('input', e => { const r = e.target.closest('.row.bad'); if (r) r.classList.remove('bad'); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('input[type=text]')) e.target.blur();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.day')) { e.preventDefault(); e.target.click(); }
});

/* swipe left / right to change week or month */
(() => {
  let x0 = 0, y0 = 0, on = false;
  const m = $('main');
  m.addEventListener('touchstart', e => { if (e.touches.length !== 1) { on = false; return; } on = true; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  m.addEventListener('touchend', e => {
    if (!on) return; on = false;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.8) step(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

/* Together: pull down to refresh */
(() => {
  const m = $('main');
  let y0 = null, dy = 0;
  m.addEventListener('touchstart', e => {
    y0 = (ui.view === 'together' && m.scrollTop <= 0 && e.touches.length === 1 && !tg.loading) ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  m.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    const p = $('#tgPull'); if (!p) return;
    p.classList.toggle('on', dy > 20); p.classList.toggle('ready', dy > 70);
    p.textContent = dy > 70 ? 'Release to refresh' : 'Pull to refresh';
  }, { passive: true });
  m.addEventListener('touchend', () => {
    if (y0 == null) return;
    y0 = null;
    const p = $('#tgPull');
    if (dy > 70) { if (p) p.textContent = 'Updating\u2026'; tgFetch(); } else if (p) p.classList.remove('on', 'ready');
  }, { passive: true });
})();

/* roll over to the new day if the app was left open overnight */
let lastDay = todayStr();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = todayStr();
  if (t !== lastDay) { lastDay = t; if (!sheetOpen) { ui.anchor = t; } render(); }
  queueSync(200);
  tgMaybeFetch();
});

/* ───────── Boot ───────── */
render();
const setHeadH = () => document.documentElement.style.setProperty('--head-h', $('.head').offsetHeight + 'px');
setHeadH(); window.addEventListener('resize', setHeadH);
if (sync.code) queueSync(300);
tgMaybeFetch();
window.addEventListener('online', () => queueSync(200));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
