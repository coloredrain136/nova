<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#fdeff4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nova">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Nova</title>
<style>
/* ───────── Design tokens ───────── */
:root{
  color-scheme: only light;

  /* The one accent token. Change this and the whole app follows. */
  --accent:#ff4d8d;
  --paper:#fdeff4;
  --paper-2:#fbe3ec;
  --accent-ink:color-mix(in srgb,var(--accent) 70%,#3a0a22);
  --accent-wash:color-mix(in srgb,var(--accent) 12%,#fff);
  --accent-soft:color-mix(in srgb,var(--accent) 24%,#fff);

  --ink:#2b1f27;
  --ink-2:#7d6b76;
  --ink-3:#b5a6af;
  --danger:#e5484d;

  /* spacing scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px; --s7:40px;
  /* radius scale */
  --r-s:10px; --r-m:16px; --r-l:22px; --r-xl:30px; --r-pill:999px;
  /* glass */
  --blur:22px;
  --glass:rgba(255,255,255,.56);
  --glass-strong:rgba(255,255,255,.8);
  --glass-clear:rgba(255,255,255,.34);
  --edge:rgba(255,255,255,.95);
  --hair:rgba(120,50,85,.10);
  /* shadows, tinted so they sit on the pink background */
  --shadow-s:0 1px 1px rgba(125,45,85,.05),0 4px 14px rgba(125,45,85,.07);
  --shadow-m:0 2px 4px rgba(125,45,85,.06),0 10px 28px rgba(125,45,85,.12);
  --shadow-l:0 4px 10px rgba(125,45,85,.08),0 24px 60px rgba(125,45,85,.22);

  --font:system-ui,-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
  --round:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%;background:var(--paper);overscroll-behavior:none}
body{
  min-height:100%;font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.35;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;
  overscroll-behavior:none;overflow:hidden;height:100%;
}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* background the glass sits on */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 60% at 0% 0%,color-mix(in srgb,var(--accent) 26%,#fff) 0%,transparent 60%),
    radial-gradient(90% 55% at 100% 18%,#ffe1cf 0%,transparent 62%),
    radial-gradient(110% 60% at 85% 100%,#e9defF 0%,transparent 60%),
    radial-gradient(90% 50% at 0% 90%,color-mix(in srgb,var(--accent) 14%,#fff) 0%,transparent 65%),
    var(--paper);
}

.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);
  backdrop-filter:blur(var(--blur)) saturate(1.7);
  border:1px solid var(--edge);
  box-shadow:var(--shadow-m),inset 0 1px 0 rgba(255,255,255,.9);
}

/* ───────── Header ───────── */
.head{
  position:fixed;top:0;left:0;right:0;z-index:5;
  padding:calc(var(--safe-t) + var(--s3)) var(--s4) var(--s3);
  background:linear-gradient(color-mix(in srgb,var(--paper) 86%,transparent),color-mix(in srgb,var(--paper) 62%,transparent));
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);
  backdrop-filter:blur(var(--blur)) saturate(1.7);
  border-bottom:1px solid rgba(255,255,255,.7);
}
.head-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);min-height:40px}
.head-left{display:flex;align-items:center;gap:10px;min-width:0}
.title{font-family:var(--round);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{font-size:.58em;font-weight:600;color:var(--ink-2);letter-spacing:0;margin-left:.24em}
.title-btn{display:flex;align-items:center;gap:6px;text-align:left;min-width:0;border-radius:var(--r-s)}
.gear-btn{flex:none;color:var(--ink)!important}
.title-btn svg{width:18px;height:18px;color:var(--ink-3);flex:none;margin-top:4px;stroke-width:2.6}
.title-btn:active{opacity:.6}
.jump-year{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4)}
.jump-year b{font-family:var(--round);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.jump-year button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.85);border:1px solid #fff;box-shadow:var(--shadow-s)}
.jump-year button:active{transform:scale(.94)}
.jump-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.jump-grid button{padding:16px 0;border-radius:var(--r-m);font-weight:600;font-size:16px;background:rgba(255,255,255,.82);border:1px solid #fff;box-shadow:var(--shadow-s)}
.jump-grid button:active{transform:scale(.96)}
.jump-grid button.now{color:var(--accent-ink);box-shadow:inset 0 0 0 2px var(--accent-soft),var(--shadow-s)}
.jump-grid button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 38%,transparent)}
.today-btn{
  font-weight:600;font-size:13.5px;color:var(--accent-ink);
  padding:7px 11px;border-radius:var(--r-pill);background:var(--glass-strong);
  border:1px solid var(--edge);box-shadow:var(--shadow-s);flex:none;
}
.head-acts{display:flex;align-items:center;gap:var(--s2);flex:none}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass-strong);border:1px solid var(--edge);box-shadow:var(--shadow-s);color:var(--accent-ink)}
.icon-btn:active{transform:scale(.94)}
.head-row{display:flex;align-items:center;justify-content:space-between;margin-top:var(--s3)}

.seg{display:inline-flex;padding:3px;border-radius:var(--r-pill);background:rgba(120,50,85,.08)}
.seg button{
  font-weight:600;font-size:14px;color:var(--ink-2);
  padding:7px 20px;border-radius:var(--r-pill);min-width:84px;
  transition:background .18s,color .18s,box-shadow .18s;
}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(125,45,85,.12),0 3px 8px rgba(125,45,85,.10)}

.arrows{display:flex;gap:var(--s2)}
.arrows button{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass-strong);border:1px solid var(--edge);box-shadow:var(--shadow-s);color:var(--ink);
}
.arrows button:active,.today-btn:active{transform:scale(.94)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ───────── Main ───────── */
main{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--head-h,calc(var(--safe-t) + 118px)) + var(--s4)) var(--s4) calc(var(--safe-b) + 150px)}
#view.go-next{animation:goNext .2s ease-out}
#view.go-prev{animation:goPrev .2s ease-out}
@keyframes goNext{from{opacity:.2;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes goPrev{from{opacity:.2;transform:translateX(-18px)}to{opacity:1;transform:none}}

/* ───────── Week view ───────── */
.week{display:flex;flex-direction:column;gap:var(--s2)}
.day{
  display:grid;grid-template-columns:52px 1fr;gap:var(--s3);align-items:start;
  padding:var(--s3) var(--s3) var(--s3) var(--s2);
  border-radius:var(--r-l);position:relative;overflow:hidden;
  border:1px solid var(--edge);
  transition:transform .12s;
}
.day:active{transform:scale(.985)}
/* off day: clear, airy glass so anything on it stands out */
.day.off{background:var(--glass-clear);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
/* work day: solid glass, washed with the shift colour, colour rail on the edge */
.day.work{
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 15%,#fff) 0%,rgba(255,255,255,.74) 62%);
  box-shadow:var(--shadow-s),inset 0 1px 0 rgba(255,255,255,.9);
}
.day.work::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}

.day-date{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:1px}
.dow{font-size:12px;font-weight:600;color:var(--ink-2)}
.num{
  font-family:var(--round);font-weight:700;font-size:22px;line-height:1;
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
}
.day.today .num{background:var(--accent);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 45%,transparent)}
.day.today .dow{color:var(--accent-ink)}

.day-body{display:flex;flex-direction:column;gap:var(--s2);min-width:0;padding-top:3px}
.shift{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px var(--s2)}
.shift-name{font-family:var(--round);font-weight:700;font-size:17px;color:color-mix(in srgb,var(--c) 62%,#2b1f27)}
.shift-time{font-size:14px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums}
.off-label{font-size:15px;font-weight:500;color:var(--ink-3);padding-top:6px}

.ev{display:grid;grid-template-columns:8px 1fr;gap:0 var(--s2);align-items:start;border-radius:var(--r-s)}
.ev::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px;grid-row:1}
.ev-title{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.ev-meta{grid-column:2;font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ev-notes{grid-column:2;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:1px}
.rep{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-left:5px;color:var(--ink-3)}
.rep svg{width:12px;height:12px;stroke-width:2.6}

.day.off .ev-title{color:var(--ink)}
.day.off:has(.ev){background:var(--glass);box-shadow:var(--shadow-s),inset 0 1px 0 rgba(255,255,255,.9)}

/* paint feedback */
.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.015)}100%{transform:none}}
body.painting .day,body.painting .cell{cursor:copy}

/* coming up */
.next{margin-top:var(--s6);padding:0 var(--s1)}
.next h2{font-family:var(--round);font-size:15px;font-weight:700;color:var(--ink-2);margin-bottom:var(--s2)}
.next-row{display:grid;grid-template-columns:92px 1fr;gap:var(--s3);padding:9px 0;border-top:1px solid var(--hair);font-size:14.5px}
.next-row span:first-child{color:var(--ink-2);font-variant-numeric:tabular-nums}
.next-row b{font-weight:600;overflow-wrap:anywhere}
.next-row i{font-style:normal;color:var(--ink-2);font-weight:400}

/* first-run card */
.hello{border-radius:var(--r-l);padding:var(--s5);margin-bottom:var(--s4)}
.hello h2{font-family:var(--round);font-size:20px;font-weight:700;margin-bottom:4px}
.hello p{color:var(--ink-2);font-size:15px;margin-bottom:var(--s4)}

/* ───────── Month view ───────── */
.mhead{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.mhead span{text-align:center;font-size:12px;font-weight:600;color:var(--ink-2)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{
  min-height:72px;border-radius:14px;padding:5px 3px 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:var(--glass-clear);border:1px solid rgba(255,255,255,.8);
}
.cell.work{background:var(--glass-strong);box-shadow:var(--shadow-s)}
.cell.out{opacity:.36}
.cell:active{transform:scale(.94)}
.cell .n{font-family:var(--round);font-weight:600;font-size:14px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.cell.today .n{background:var(--accent);color:#fff;font-weight:700}
.chip-s{
  width:calc(100% - 2px);text-align:center;border-radius:7px;padding:2px 0;
  font-family:var(--round);font-weight:700;font-size:11.5px;line-height:1.3;
  background:color-mix(in srgb,var(--c) 24%,#fff);color:color-mix(in srgb,var(--c) 58%,#2b1f27);
}
.chip-s.none{background:none;color:transparent}
.dots{display:flex;gap:3px;align-items:center;height:7px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dots em{font-style:normal;font-size:9px;font-weight:700;color:var(--accent-ink);line-height:1}

/* ───────── Dock ───────── */
.dock-wrap{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 var(--s4) calc(var(--safe-b) + var(--s3));pointer-events:none}
.dock,.tray{background:rgba(255,255,255,.74)}
.dock{
  pointer-events:auto;margin:0 auto;max-width:360px;border-radius:var(--r-xl);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 10px;
  box-shadow:var(--shadow-l),inset 0 1px 0 rgba(255,255,255,.9);
}
.dock-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:11.5px;font-weight:600;color:var(--ink-2);border-radius:var(--r-m)}
.dock-btn svg{width:23px;height:23px;color:var(--ink)}
.dock-btn:active{background:rgba(120,50,85,.07)}
.add-btn{
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;margin:0 var(--s2);
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 78%,#fff),var(--accent));
  box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.5);
}
.add-btn svg{width:26px;height:26px;stroke-width:2.6}
.add-btn:active{transform:scale(.93)}

/* paint tray */
.tray{pointer-events:auto;margin:0 auto;max-width:420px;border-radius:var(--r-xl);padding:var(--s3) var(--s3) var(--s3);box-shadow:var(--shadow-l),inset 0 1px 0 rgba(255,255,255,.9)}
.tray-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:0 var(--s1) var(--s3) var(--s2)}
.tray-top span{font-family:var(--round);font-weight:700;font-size:16px;white-space:nowrap}
.tray-chips{display:flex;gap:var(--s2);overflow-x:auto;padding:3px;margin:-3px;scrollbar-width:none}
.tray-chips::-webkit-scrollbar{display:none}

.chip{
  flex:none;display:inline-flex;align-items:center;gap:7px;
  padding:9px 14px 9px 10px;border-radius:var(--r-pill);font-weight:600;font-size:15px;
  background:rgba(255,255,255,.8);border:1px solid var(--edge);box-shadow:var(--shadow-s);
}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.chip.clear i{background:none;border:2px dashed var(--ink-3)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--ink-3)) 20%,#fff);box-shadow:0 0 0 2px var(--c,var(--ink-2)),var(--shadow-s)}

/* ───────── Buttons ───────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  padding:11px 18px;border-radius:var(--r-pill);font-weight:600;font-size:16px;
}
.btn:active{transform:scale(.97)}
.btn.primary{color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.quiet{color:var(--accent-ink);background:var(--accent-wash)}
.btn.danger{color:var(--danger);background:rgba(229,72,77,.09)}
.btn.small{padding:8px 16px;font-size:15px}
.btn.wide{width:100%}

/* ───────── Sheets ───────── */
.scrim{position:fixed;inset:0;z-index:10;background:rgba(60,20,40,.22);opacity:0;transition:opacity .22s}
.scrim.open{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:11;
  max-height:calc(100dvh - var(--safe-t) - 28px);overflow-y:auto;overscroll-behavior:contain;
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  background:rgba(255,246,250,.9);
  -webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);
  border-top:1px solid #fff;box-shadow:var(--shadow-l);
  padding:var(--s2) var(--s4) calc(var(--safe-b) + var(--s5));
  transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.85,.25,1);
}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(120,50,85,.18);margin:0 auto var(--s3)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
.sheet-head h2{font-family:var(--round);font-weight:700;font-size:22px;letter-spacing:-.01em}
.link{color:var(--accent-ink);font-weight:600;font-size:16px;padding:6px 2px}
.sub{font-size:13.5px;font-weight:600;color:var(--ink-2);margin:var(--s5) var(--s1) var(--s2)}
.sub:first-of-type{margin-top:0}
.chips-wrap{display:flex;flex-wrap:wrap;gap:var(--s2)}
.empty{color:var(--ink-2);font-size:15px;padding:var(--s2) var(--s1)}

.group{background:rgba(255,255,255,.82);border:1px solid #fff;border-radius:var(--r-m);box-shadow:var(--shadow-s);overflow:hidden}
.group + .group{margin-top:var(--s3)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:50px;padding:6px var(--s4);border-top:1px solid var(--hair)}
.row:first-child{border-top:0}
.row > label,.row > .lbl{font-size:16px;flex:none}
.row input[type=text],.row select{border:0;background:none;text-align:right;flex:1;min-width:0;outline:none;height:38px;font-size:16px}
.row input[type=date],.row input[type=time]{border:0;background:rgba(120,50,85,.07);border-radius:9px;padding:6px 10px;font-size:16px;min-height:36px;outline:none}
.row select{-webkit-appearance:none;appearance:none;color:var(--accent-ink);font-weight:600;direction:rtl}
.row.title-row input{text-align:left;font-size:19px;font-weight:600;font-family:var(--round)}
.row.title-row input::placeholder,textarea::placeholder{color:var(--ink-3)}
.row.bad{background:rgba(229,72,77,.08)}
textarea{display:block;width:100%;min-height:76px;border:0;background:none;resize:none;outline:none;padding:var(--s3) var(--s4);font-size:16px}
.hint{font-size:13px;color:var(--ink-2);margin:var(--s2) var(--s1) 0}
.actions{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s5)}

.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0}
.switch span{position:absolute;inset:0;border-radius:var(--r-pill);background:rgba(120,50,85,.16);transition:background .18s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .18s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}

/* day sheet event list */
.list-ev{display:grid;grid-template-columns:8px 1fr auto;gap:0 var(--s3);align-items:start;width:100%;text-align:left;padding:var(--s3) var(--s4);border-top:1px solid var(--hair)}
.list-ev:first-child{border-top:0}
.list-ev::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:7px}
.list-ev svg{color:var(--ink-3);margin-top:2px;width:16px;height:16px}

/* my shifts */
.preset{display:grid;grid-template-columns:30px 44px 1fr auto;gap:var(--s2) 10px;align-items:center;padding:10px var(--s3) 10px 6px;border-top:1px solid var(--hair);background:rgba(255,255,255,.01);transition:transform .16s}
.preset.dragging{transition:none;position:relative;z-index:2;background:#fff;box-shadow:var(--shadow-m);border-radius:var(--r-m);border-top-color:transparent}
.grip{display:grid;place-items:center;height:44px;color:var(--ink-3);touch-action:none;cursor:grab}
.intro{font-size:15px;color:var(--ink-2);margin:calc(var(--s2) * -1) var(--s1) var(--s4)}
.intro b{color:var(--ink);font-weight:600}
.preset:first-child{border-top:0}
.badge{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--round);font-weight:700;font-size:15px;background:color-mix(in srgb,var(--c) 24%,#fff);color:color-mix(in srgb,var(--c) 58%,#2b1f27)}
.preset-main{text-align:left;min-width:0}
.preset-main{display:block}
.preset-main b{display:block;font-weight:600;font-size:16px;overflow-wrap:anywhere}
.preset-main span{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.move{display:flex;gap:2px}
.move button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.move button:disabled{opacity:.25}
.move button:active{background:rgba(120,50,85,.08)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;padding:var(--s3) var(--s4)}
.swatch{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--c)}
.row-val{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:15px}
.row-val svg{width:15px;height:15px;color:var(--ink-3)}
button.row{text-align:left}
.seg.sm button{padding:6px 14px;min-width:0;font-size:14px}

/* paint review */
.tray-acts{display:flex;gap:var(--s2)}
.btn:disabled{opacity:.4}
.review{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(60,20,40,.28);padding:calc(var(--safe-t) + var(--s5)) var(--s5) calc(var(--safe-b) + var(--s5))}
.review-card{width:100%;max-width:380px;max-height:100%;display:flex;flex-direction:column;border-radius:var(--r-xl);background:#fffafc;box-shadow:var(--shadow-l);padding:var(--s5);animation:rise .2s ease-out}
.review-card h2{font-family:var(--round);font-weight:700;font-size:22px;letter-spacing:-.01em}
.review-sum{color:var(--ink-2);font-size:14.5px;margin:2px 0 var(--s3)}
.review-list{overflow-y:auto;overscroll-behavior:contain;margin:0 calc(var(--s2) * -1);padding:0 var(--s2)}
.review-row{display:grid;grid-template-columns:96px 1fr;gap:var(--s3);padding:10px 0;border-top:1px solid var(--hair);font-size:15px;align-items:baseline}
.review-row span{color:var(--ink-2);font-variant-numeric:tabular-nums}
.review-row b{font-weight:600;overflow-wrap:anywhere}
.review-row b i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:7px}
.review-row b.gone{color:var(--ink-2);font-weight:500}
.review-row em{display:block;font-style:normal;font-weight:400;font-size:13px;color:var(--ink-3)}
.review-acts{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s4)}

.share-img{display:block;width:100%;border-radius:var(--r-l);box-shadow:var(--shadow-m);-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}

/* chooser */
.ask{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(60,20,40,.28);padding:var(--s3) var(--s3) calc(var(--safe-b) + var(--s3))}
.ask-card{width:100%;max-width:420px;margin:0 auto;border-radius:var(--r-l);background:#fffafc;box-shadow:var(--shadow-l);overflow:hidden;animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.ask-card p{padding:var(--s4) var(--s4) var(--s3);text-align:center;font-size:14px;color:var(--ink-2)}
.ask-card button{display:block;width:100%;padding:15px;font-size:17px;font-weight:600;color:var(--accent-ink);border-top:1px solid var(--hair)}
.ask-card button.danger{color:var(--danger)}
.ask-card button.cancel{color:var(--ink-2);font-weight:500}
.ask-card button:active{background:rgba(120,50,85,.06)}

/* ───────── Together ─────────
   Everything here is tg- prefixed so it can't collide with the calendar's classes. */
:root{
  --tg-me:var(--accent);
  --tg-them:#7b6cf6;
  --tg-free:#2fb985;
  --tg-free-wash:rgba(47,185,133,.20);
  --tg-sleep:#a99fa6;
}
.head.tg-mode .title-btn svg,.head.tg-mode .arrows,.head.tg-mode .today-btn,.head.tg-mode [data-act="share"]{visibility:hidden}
.head.tg-mode .title-btn{pointer-events:none}
.head .seg button{padding:7px 14px;min-width:70px}

.tg-pull{position:fixed;left:50%;top:calc(var(--head-h) + 8px);z-index:4;transform:translate(-50%,-6px);opacity:0;pointer-events:none;
  padding:6px 14px;border-radius:var(--r-pill);background:var(--glass-strong);border:1px solid var(--edge);box-shadow:var(--shadow-s);
  font-size:13px;font-weight:600;color:var(--ink-2);transition:opacity .15s,transform .15s}
.tg-pull.ready{color:var(--accent-ink)}
.tg-pull.on{opacity:1;transform:translate(-50%,0)}

.tg-state{border-radius:var(--r-l);padding:var(--s5)}
.tg-state h2{font-family:var(--round);font-size:20px;font-weight:700;margin-bottom:4px}
.tg-state p{color:var(--ink-2);font-size:15px;margin-bottom:var(--s4)}
.tg-loading p{margin:0}
.tg-skel{height:14px;border-radius:7px;margin-top:var(--s3);background:linear-gradient(90deg,rgba(120,50,85,.07),rgba(120,50,85,.13),rgba(120,50,85,.07));background-size:200% 100%;animation:tgShine 1.2s linear infinite}
.tg-skel-s{width:60%}
@keyframes tgShine{from{background-position:200% 0}to{background-position:0 0}}

.tg-banner{font-size:14px;color:var(--ink-2);background:rgba(255,255,255,.66);border:1px solid var(--edge);border-radius:var(--r-m);padding:10px 14px;margin-bottom:var(--s3)}
.tg-banner b{color:var(--ink);font-weight:600}

.tg-hero{border-radius:var(--r-xl);padding:var(--s5) var(--s4) var(--s4);cursor:pointer;
  background:linear-gradient(160deg,rgba(255,255,255,.82),rgba(255,255,255,.58));}
.tg-hero:active{transform:scale(.99)}
.tg-hero-none{cursor:default}
.tg-hero-none:active{transform:none}
.tg-hero-k{font-size:14px;font-weight:600;color:var(--accent-ink)}
.tg-hero-day{font-family:var(--round);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px}
.tg-hero-none .tg-hero-day{font-size:22px}
.tg-hero-sub{color:var(--ink-2);font-size:15px;margin-top:6px}
.tg-hero-when{display:flex;align-items:center;gap:var(--s2);font-size:17px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:var(--s4)}
.tg-len{display:inline-block;font-size:13px;font-weight:700;font-family:var(--round);color:#18825c;background:rgba(47,185,133,.14);padding:2px 8px;border-radius:var(--r-pill);white-space:nowrap}

/* timeline */
.tg-tl{display:grid;grid-template-columns:1fr;gap:0 8px;align-items:start}
.tg-tl-big{grid-template-columns:auto 1fr}
.tg-tl-names{display:flex;flex-direction:column;gap:6px;padding-top:1px}
.tg-tl-names span{height:16px;line-height:16px;font-size:12px;font-weight:600;color:var(--ink-2)}
.tg-tl-names span:first-child{color:color-mix(in srgb,var(--tg-me) 70%,#3a0a22)}
.tg-tl-names span:last-child{color:color-mix(in srgb,var(--tg-them) 70%,#1e1550)}
.tg-tl-body{min-width:0}
.tg-tl-track{position:relative;display:flex;flex-direction:column;gap:6px}
.tg-tl:not(.tg-tl-big) .tg-tl-track{gap:3px}
.tg-lane{position:relative;height:16px;border-radius:5px;background:rgba(120,50,85,.06);overflow:hidden}
.tg-tl:not(.tg-tl-big) .tg-lane{height:6px;border-radius:3px}
.tg-blk{position:absolute;top:0;bottom:0}
.tg-lane-me{--c:var(--tg-me)}
.tg-lane-them{--c:var(--tg-them)}
.tg-blk-busy{background:var(--c)}
.tg-blk-sleep{background:repeating-linear-gradient(45deg,var(--tg-sleep) 0 1.5px,rgba(169,159,166,.18) 1.5px 5px)}
.tg-band{position:absolute;top:-3px;bottom:-3px;border-radius:6px;background:var(--tg-free-wash);box-shadow:inset 0 0 0 1.5px rgba(47,185,133,.55)}
.tg-tl:not(.tg-tl-big) .tg-band{top:-2px;bottom:-2px;border-radius:4px}
.tg-past{position:absolute;left:0;top:-3px;bottom:-3px;z-index:1;background:color-mix(in srgb,var(--paper) 66%,transparent);border-radius:6px}
.tg-ticks{position:relative;height:16px;margin-top:5px}
.tg-ticks span{position:absolute;top:0;transform:translateX(-50%);font-size:11px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tg-ticks span:first-child{transform:none}
.tg-ticks span:last-child{transform:translateX(-100%)}
.tg-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:var(--s3);font-size:12px;color:var(--ink-2)}
.tg-legend span{display:inline-flex;align-items:center;gap:5px}
.tg-key{width:14px;height:9px;border-radius:3px;display:inline-block}
.tg-key-busy{background:linear-gradient(90deg,var(--tg-me) 50%,var(--tg-them) 50%)}
.tg-key-sleep{background:repeating-linear-gradient(45deg,var(--tg-sleep) 0 1.5px,rgba(169,159,166,.2) 1.5px 4px)}
.tg-key-band{background:var(--tg-free-wash);box-shadow:inset 0 0 0 1.5px rgba(47,185,133,.55)}

.tg-chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s4) 0 var(--s2)}
.tg-chip{font-size:13.5px;font-weight:600;color:var(--ink);padding:6px 12px;border-radius:var(--r-pill);background:rgba(255,255,255,.7);border:1px solid var(--edge)}

.tg-week{margin-top:var(--s5)}
.tg-week h3{font-family:var(--round);font-size:15px;font-weight:700;color:var(--ink-2);margin:0 var(--s1) var(--s2)}
.tg-rows{display:flex;flex-direction:column;gap:var(--s2)}
.tg-row{display:grid;grid-template-columns:44px 1fr;gap:var(--s3);align-items:start;width:100%;text-align:left;
  padding:var(--s3) var(--s4) var(--s3) var(--s3);border-radius:var(--r-l);background:rgba(255,255,255,.62);border:1px solid var(--edge);box-shadow:var(--shadow-s)}
.tg-row:active{transform:scale(.985)}
.tg-k-full{background:linear-gradient(90deg,rgba(47,185,133,.14),rgba(255,255,255,.7) 65%)}
.tg-row-date{display:flex;flex-direction:column;align-items:center;gap:1px}
.tg-row-date small{font-size:12px;font-weight:600;color:var(--ink-2)}
.tg-row-date b{font-family:var(--round);font-size:22px;font-weight:700;line-height:1.1}
.tg-row-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.tg-row-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
.tg-row-top b{font-family:var(--round);font-weight:700;font-size:16.5px}
.tg-k-full .tg-row-top b{color:#18825c}
.tg-row-time{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tg-row-time i{font-style:normal;color:var(--ink-3)}
.tg-row .tg-tl{margin-top:8px}

.tg-foot{margin-top:var(--s6);padding:0 var(--s1);font-size:13.5px;color:var(--ink-2)}
.tg-foot p{margin-bottom:6px}
.tg-foot-acts{display:flex;flex-wrap:wrap;align-items:center;gap:2px var(--s4);margin-top:var(--s2)}
.tg-foot-acts .link{font-size:14px}

/* day sheet */
.tg-day-tl{padding:var(--s4)}
.tg-cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s5)}
.tg-col h3{font-family:var(--round);font-size:15px;font-weight:700;margin:0 var(--s1) var(--s2)}
.tg-col-me h3{color:color-mix(in srgb,var(--tg-me) 70%,#3a0a22)}
.tg-col-them h3{color:color-mix(in srgb,var(--tg-them) 70%,#1e1550)}
.tg-col ul{list-style:none;background:rgba(255,255,255,.82);border:1px solid #fff;border-radius:var(--r-m);box-shadow:var(--shadow-s);overflow:hidden}
.tg-li{display:flex;flex-direction:column;gap:1px;padding:10px 12px 10px 24px;border-top:1px solid var(--hair);position:relative;font-size:14px}
.tg-li:first-child{border-top:0}
.tg-li::before{content:"";position:absolute;left:10px;top:15px;width:8px;height:8px;border-radius:50%}
.tg-col-me .tg-li{--c:var(--tg-me)}
.tg-col-them .tg-li{--c:var(--tg-them)}
.tg-li-work::before,.tg-li-plan::before{background:var(--c)}
.tg-li-note::before{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.tg-li-sleep::before{background:var(--tg-sleep)}
.tg-li b{font-weight:600;overflow-wrap:anywhere}
.tg-li span{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tg-col-none{font-size:14px;color:var(--ink-3);padding:var(--s2) var(--s1)}

/* settings */
.tg-hours{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--ink-2)}
.tg-hours select{flex:none;width:auto;direction:ltr;text-align:right}
.row select[data-tgset]{direction:ltr;text-align:right;text-align-last:right}
.tg-wide{display:flex;width:100%}
.tg-wide button{flex:1}

/* ───────── Settings ───────── */
.set-head{margin-bottom:var(--s2)}
.set-back{display:inline-flex;align-items:center;gap:2px;margin-left:-6px}
.set-back svg{width:20px;height:20px;stroke-width:2.4}
.set-title{font-family:var(--round);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0 var(--s1) var(--s4)}
.set-link{width:100%;text-align:left;justify-content:flex-start}
.set-link .lbl{flex:1}
.set-link:active{background:rgba(120,50,85,.05)}
.set-tile{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.set-tile svg{width:18px;height:18px;stroke-width:2}
.row .lbl small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px;font-weight:400}
.row > .lbl{flex:1 1 auto;min-width:0}
.row .seg.sm{flex:none}
.set-sel{flex:1;text-align:right;direction:ltr!important;text-align-last:right}
.row input[type=text]#set-prefix{text-align:right}
.set-swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);padding:var(--s3)}
.set-swatch{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-m);font-size:14.5px;font-weight:600;background:rgba(120,50,85,.04)}
.set-swatch i{width:22px;height:22px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.set-swatch[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 14%,#fff);box-shadow:inset 0 0 0 2px var(--c)}
.set-status{border-radius:var(--r-l);padding:var(--s4) var(--s4) var(--s4);margin-bottom:var(--s2)}
.set-status b{font-family:var(--round);font-size:18px;font-weight:700;display:block}
.set-status.on b{color:#18825c}
.set-status p{font-size:14.5px;color:var(--ink-2);margin:4px 0 var(--s3)}
.set-status .btn{margin-top:var(--s2)}
.set-status p.set-msg{margin:var(--s3) 0 0;color:var(--ink)}
.set-btns{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.set-btns .btn{margin:0}

/* in-app banner */
.toast{position:fixed;left:12px;right:12px;top:calc(var(--safe-t) + 8px);z-index:30;display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:var(--r-l);background:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);
  border:1px solid #fff;box-shadow:var(--shadow-l);transform:translateY(calc(-100% - 40px));transition:transform .32s cubic-bezier(.2,.85,.25,1)}
.toast.show{transform:none}
.toast-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 78%,#fff),var(--accent))}
.toast-icon svg{width:19px;height:19px}
.toast-text{display:flex;flex-direction:column;min-width:0}
.toast-text b{font-weight:600;font-size:15px}
.toast-text span{font-size:14px;color:var(--ink-2)}

/* share preview */
.sh-prev{max-height:50vh;overflow-y:auto;border-radius:var(--r-l);background:rgba(120,50,85,.05);padding:10px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sh-prev img{display:block;width:100%;border-radius:14px;box-shadow:var(--shadow-m);-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.sh-opts{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s4)}
.sh-seg{display:flex;width:100%}
.sh-seg button{flex:1}
.sh-chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:2px}
.sh-chip{padding:8px 14px;border-radius:var(--r-pill);font-size:14px;font-weight:600;color:var(--ink-2);background:rgba(255,255,255,.7);border:1px solid var(--edge)}
.sh-chip[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 30%,#fff)}
.sh-chip:disabled{opacity:.4}

/* settings that change the calendar */
.bg-plain .bg{background:var(--paper)}
.compact .week{gap:6px}
.compact .day{padding:8px 10px 8px 6px;gap:var(--s2)}
.compact .day-body{gap:4px;padding-top:1px}
.compact .num{width:30px;height:30px;font-size:19px}
.compact .cell{min-height:62px}
.dim-past .day.past,.dim-past .cell.past:not(.out){opacity:.5}
.no-dots .dots{visibility:hidden}
.no-labels .chip-s{color:transparent!important}
.no-motion *,.no-motion *::before,.no-motion *::after{animation:none!important;transition:none!important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

    </div>
    <div class="arrows">
      <button data-act="prev" aria-label="Previous"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button data-act="next" aria-label="Next"><svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
</header>

<main><div id="view"></div></main>

<div class="dock-wrap" id="dock"></div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="review" id="review" hidden></div>
<div class="ask" id="ask" hidden></div>

<script>
'use strict';
/* ═════════ Nova 8 ═════════
   Local-first: everything draws from localStorage. All writes go through save(),
   which is the single place background sync will hook into later. */

/* ───────── Storage ───────── */
const KEY = 'nova:v1';
const blank = () => ({
  shiftTypes: [],            // {id,name,label,start_time,end_time,color,position,created_at}
  shifts: {},                // { 'YYYY-MM-DD': shiftTypeId }  (one shift per day)
  events: [],                // {id,title,date,start_time,end_time,all_day,notes,repeat,repeat_until,created_at}
  skips: [],                 // {event_id,date}
  settings: { view: 'week', weekStart: 0 }
});
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    const d = JSON.parse(raw), b = blank();
    return { ...b, ...d, settings: { ...b.settings, ...(d.settings || {}) } };
  } catch (e) { return blank(); }
}
let db = load();
let skipSet = new Set();
function reindex() { skipSet = new Set(db.skips.map(s => s.event_id + '|' + s.date)); }
function persist() {
  reindex();
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { console.warn('Nova: could not save', e); }
}
function save() {
  persist();
  dirtySeq++;
  queueSync();
}
reindex();

/* ───────── Settings values ─────────
   Everything in Settings lives in db.settings.prefs, grouped by section. It's backed up with the
   rest (nova_settings.prefs), so it survives a reinstall and the notification sweep can read it.
   Only changed values are stored; anything missing falls back to PREF_DEF. */
const ACCENTS = { pink: ['Pink', '#ff4d8d'], rose: ['Rose', '#e5466e'], coral: ['Coral', '#ff7655'], lavender: ['Lavender', '#9168f5'], sky: ['Sky', '#3a93f3'], mint: ['Mint', '#1fae82'] };
const PREF_DEF = {
  appearance: { accent: 'pink', bg: 'glow', time24: false, compact: false, nextDay: true, motion: true },
  calendar: { openTo: 'last', showOff: true, dimPast: false, comingUp: 4, monthDots: true, monthLabels: true, swipe: true },
  shifts: { review: true, paintStart: 'last' },
  plans: { start: '17:00', length: 60 },
  share: { range: 'week', style: 'list', plans: true, times: true, offDays: true, hideNames: false, prefix: 'Work' },
  notify: { shiftEve: true, eveTime: '20:00', shiftBefore: 'none', eventBefore: '60', notes: true, notesTime: '08:00', daily: false, dailyTime: '06:30', weekly: false, weeklyDay: 0, weeklyTime: '18:00', together: false, togetherTime: '10:00', quiet: true, quietFrom: '22:00', quietTo: '06:00' },
  together: { weeks: 4, minH: 3, h0: 9, h1: 23, sleep: 14 }
};
const pref = sec => ({ ...PREF_DEF[sec], ...(((db.settings.prefs || {})[sec]) || {}) });
function setPrefs(sec, vals) {
  const p = { ...(db.settings.prefs || {}) };
  p[sec] = { ...(p[sec] || {}), ...vals };
  for (const k of Object.keys(p[sec])) if (p[sec][k] === PREF_DEF[sec][k]) delete p[sec][k];   // keep only what differs
  if (!Object.keys(p[sec]).length) delete p[sec];

  save(); applyPrefs();
}
const setPref = (sec, k, v) => setPrefs(sec, { [k]: v });
function canon(v) {          // same object → same JSON, whatever order the keys came back in
  if (Array.isArray(v)) return v.map(canon);
  if (v && typeof v === 'object') return Object.keys(v).sort().reduce((o, k) => { o[k] = canon(v[k]); return o; }, {});
  return v;
}
// The Together settings used to live only on the phone. Move them into the backed-up prefs.
if (db.settings.tg) {
  if (!(db.settings.prefs && db.settings.prefs.together)) db.settings.prefs = { ...(db.settings.prefs || {}), together: db.settings.tg };
  delete db.settings.tg;
}
function applyPrefs() {
  const a = pref('appearance'), c = pref('calendar'), b = document.body, r = document.documentElement;
  const accent = (ACCENTS[a.accent] || ACCENTS.pink)[1];
  const rgb = [1, 3, 5].map(i => parseInt(accent.slice(i, i + 2), 16));
  const tint = k => '#' + rgb.map(v => Math.round(v * k + 255 * (1 - k)).toString(16).padStart(2, '0')).join('');
  r.style.setProperty('--accent', accent);
  r.style.setProperty('--paper', tint(0.07));        // the page colour, a faint wash of the accent
  r.style.setProperty('--paper-2', tint(0.11));
  b.classList.toggle('bg-plain', a.bg === 'plain');
  b.classList.toggle('compact', !!a.compact);
  b.classList.toggle('no-motion', a.motion === false);
  b.classList.toggle('dim-past', !!c.dimPast);
  b.classList.toggle('no-dots', c.monthDots === false);
  b.classList.toggle('no-labels', c.monthLabels === false);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', tint(0.09));
}

/* ───────── Dates ───────── */
const pad = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const utc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const dayDiff = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
const todayStr = () => ds(new Date());
const weekStartOf = s => addDays(s, -((pd(s).getDay() - db.settings.weekStart + 7) % 7));
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MON_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function fmtTime(t, withMer = true) {
  if (!t) return '';
  let [h, m] = t.split(':').map(Number);
  if (pref('appearance').time24) return pad(h) + ':' + pad(m);
  const mer = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + pad(m) + (withMer ? ' ' + mer : '');
}
const isPM = t => Number(t.split(':')[0]) >= 12;
function fmtRange(a, b) {
  if (!a) return '';
  if (!b) return fmtTime(a);
  if (pref('appearance').time24) return fmtTime(a) + ' – ' + fmtTime(b);
  const sameHalf = isPM(a) === isPM(b) && b > a;
  return fmtTime(a, !sameHalf) + ' – ' + fmtTime(b);
}
const overnight = t => t.start_time && t.end_time && t.end_time <= t.start_time;
const shiftRange = t => fmtRange(t.start_time, t.end_time) + (overnight(t) && pref('appearance').nextDay ? ' next day' : '');

/* ───────── Helpers ───────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const typeById = id => db.shiftTypes.find(t => t.id === id);
const shiftOn = date => { const id = db.shifts[date]; return id ? typeById(id) : null; };
const sortedTypes = () => [...db.shiftTypes].sort((a, b) => a.position - b.position);

const ICON = {
  repeat: '<svg class="i" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/></svg>',
  brush: '<svg class="i" viewBox="0 0 24 24"><path d="M20.5 3.5a2.1 2.1 0 00-3 0l-7.6 8 2.6 2.6 8-7.6a2.1 2.1 0 000-3z"/><path d="M8.6 13.2c-2.2.1-3.6 1.5-3.8 3.5-.1 1.3-.8 2.2-1.8 2.6 3.3 1.3 7.4.3 7.9-3.3"/></svg>',
  list: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  chev: '<svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  up: '<svg class="i" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
  grip: '<svg class="i" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"/></svg>',
  down: '<svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  back: '<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  bell: '<svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 004 0"/></svg>'
};
const COLORS = ['#ff5c8a', '#ff7a59', '#f5a524', '#34c38f', '#22b8cf', '#4c8dff', '#8b6cff', '#c05cff', '#7a8194'];

/* ───────── Events ───────── */
function occursOn(ev, date) {
  if (date < ev.date) return false;
  if (!ev.repeat || ev.repeat === 'none') return date === ev.date;
  if (ev.repeat_until && date > ev.repeat_until) return false;
  if (skipSet.has(ev.id + '|' + date)) return false;
  const n = dayDiff(ev.date, date);
  if (ev.repeat === 'weekly') return n % 7 === 0;
  if (ev.repeat === 'biweekly') return n % 14 === 0;
  if (ev.repeat === 'monthly') return pd(date).getDate() === pd(ev.date).getDate();
  return false;
}
const evKey = e => (e.all_day ? '' : (e.start_time || ''));
function eventsOn(date) {
  return db.events.filter(e => occursOn(e, date)).sort((a, b) => evKey(a).localeCompare(evKey(b)) || a.title.localeCompare(b.title));
}
const evTime = e => (e.all_day ? '' : fmtRange(e.start_time, e.end_time));
const isRepeat = e => e.repeat && e.repeat !== 'none';

/* ───────── Backup sync ─────────
   The phone is the source of truth while she's using it. Every save() is compared with
   the last copy the server confirmed (sync.snap) and only the differences are sent.
   The first time a phone connects, the server's copy wins if it has anything in it,
   which is how a reinstall (or starter data) gets restored. */
const SYNC_KEY = 'nova:sync';
let sync = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } })();
sync = { code: sync.code || '', snap: sync.snap || null, at: sync.at || null, state: sync.code ? 'wait' : 'off' };
function saveSync() { try { localStorage.setItem(SYNC_KEY, JSON.stringify({ code: sync.code, snap: sync.snap, at: sync.at })); } catch (e) {} }
let dirtySeq = 0, syncing = false, syncTimer = null;

const SYNC_TABLES = ['shift_types', 'events', 'shifts', 'skips', 'settings'];
const NORM = {
  shift_types: r => ({ id: r.id, name: r.name, label: r.label || '', start_time: r.start_time, end_time: r.end_time, color: r.color, position: r.position || 0, together: r.together === 'work' || r.together === 'ignore' ? r.together : null, remind: r.remind || null }),
  events: r => ({ id: r.id, title: r.title, date: r.date, start_time: r.start_time || null, end_time: r.end_time || null, all_day: !!r.all_day, notes: r.notes || '', repeat: r.repeat || 'none', repeat_until: r.repeat_until || null, remind: r.remind || null }),
  shifts: r => ({ date: r.date, shift_type_id: r.shift_type_id }),
  skips: r => ({ event_id: r.event_id, date: r.date }),
  settings: r => ({ id: r.id, view: r.view || 'week', week_start: r.week_start || 0, share_on: r.share_on !== false, prefs: canon(r.prefs && typeof r.prefs === 'object' ? r.prefs : {}) })
};
const ROWKEY = { shift_types: r => r.id, events: r => r.id, shifts: r => r.date, skips: r => r.event_id + '|' + r.date, settings: r => r.id };
function toRows(d) {
  const typeIds = new Set(d.shiftTypes.map(t => t.id)), evIds = new Set(d.events.map(e => e.id));
  return {
    shift_types: d.shiftTypes.map(NORM.shift_types),
    events: d.events.map(NORM.events),
    shifts: Object.entries(d.shifts).filter(([, id]) => typeIds.has(id)).map(([date, id]) => ({ date, shift_type_id: id })),
    skips: d.skips.filter(s => evIds.has(s.event_id)).map(NORM.skips),
    settings: [{ id: 'main', view: d.settings.view, week_start: d.settings.weekStart, share_on: d.settings.shareOn !== false, prefs: canon(d.settings.prefs || {}) }]
  };
}
function fromRows(r) {
  const st = r.settings.find(x => x.id === 'main');
  return {
    shiftTypes: r.shift_types.map(x => ({ ...x })),
    shifts: Object.fromEntries(r.shifts.map(x => [x.date, x.shift_type_id])),
    events: r.events.map(x => ({ ...x })),
    skips: r.skips.map(x => ({ ...x })),
    settings: st ? { ...db.settings, view: st.view, weekStart: st.week_start, shareOn: st.share_on !== false, prefs: st.prefs || {} } : { ...db.settings }   // keeps phone-only settings like Together's
  };
}
function normAll(data) {
  const out = {};
  for (const t of SYNC_TABLES) out[t] = ((data && data[t]) || []).map(NORM[t]);
  return out;
}
function diffRows(local, snap) {
  const upserts = {}, deletes = {};
  let n = 0;
  for (const t of SYNC_TABLES) {
    const old = new Map(snap[t].map(r => [ROWKEY[t](r), JSON.stringify(r)])), seen = new Set();
    const up = [], del = [];
    for (const r of local[t]) { const k = ROWKEY[t](r); seen.add(k); if (old.get(k) !== JSON.stringify(r)) up.push(r); }
    for (const r of snap[t]) { if (!seen.has(ROWKEY[t](r))) del.push(t === 'skips' ? r : ROWKEY[t](r)); }
    if (up.length) upserts[t] = up;
    if (del.length) deletes[t] = del;
    n += up.length + del.length;
  }
  return { upserts, deletes, n };
}
function setSyncState(st) {
  sync.state = st;
  const el = document.getElementById('backupStatus');
  if (el) el.textContent = backupLabel();
}
function backupLabel() {
  return { off: 'Off', busy: 'Backing up…', ok: 'On', wait: 'Will back up when online', bad: 'Wrong passcode' }[sync.state] || 'Off';
}
function queueSync(ms = 700) {
  if (!sync.code) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, ms);
}
async function syncNow() {
  if (!sync.code || syncing) return;
  if (ui.paint) return;          // nothing is sent until she confirms the painted shifts
  syncing = true; setSyncState('busy');
  let again = false;
  try {
    const first = !sync.snap, seq = dirtySeq;
    const d = first ? { upserts: {}, deletes: {} } : diffRows(toRows(db), sync.snap);
    const res = await fetch('/api/db', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'x-nova-passcode': sync.code },
      body: JSON.stringify({ action: 'sync', upserts: d.upserts, deletes: d.deletes })
    });
    if (res.status === 401) { setSyncState('bad'); return; }
    if (!res.ok) throw new Error('sync ' + res.status);
    const server = normAll((await res.json()).data);
    sync.snap = server; sync.at = Date.now(); saveSync();
    const serverHasData = server.shift_types.length || server.events.length || server.shifts.length;
    if (first && !serverHasData) again = true;                 // empty backup: send up what's on the phone
    else if (seq !== dirtySeq) again = true;                   // she kept editing while it was sending
    else if (ui.paint) again = false;                          // mid-paint: leave the phone's copy alone
    else { db = fromRows(server); persist(); applyPrefs(); render(); }
    setSyncState('ok');
  } catch (e) {
    setSyncState('wait');
  } finally {
    syncing = false;
    if (again) queueSync(50);
  }
}

/* ───────── UI state ───────── */
const OPEN_TO = (() => { const o = pref('calendar').openTo; return o === 'last' ? db.settings.view : o; })();
const ui = { view: ['month', 'together'].includes(OPEN_TO) ? OPEN_TO : 'week', anchor: todayStr(), paint: null, lastPaint: null };

/* ───────── Render ───────── */
function render(dir) {
  renderHead();
  const v = $('#view');
  v.innerHTML = ui.view === 'together' ? togetherHTML() : ui.view === 'week' ? weekHTML() : monthHTML();
  if (dir) { v.classList.remove('go-next', 'go-prev'); void v.offsetWidth; v.classList.add(dir > 0 ? 'go-next' : 'go-prev'); }
  renderDock();
  document.body.classList.toggle('painting', !!ui.paint);
}

function fitTitle() {           // shrink the title a little rather than cut it off (small iPhones, Today showing)
  const t = $('#title');
  t.style.fontSize = '';
  for (let px = 25; px >= 17 && t.scrollWidth > t.clientWidth; px--) t.style.fontSize = px + 'px';
}
window.addEventListener('resize', () => fitTitle());
function renderHead() {
  const today = todayStr(), nowY = new Date().getFullYear();
  let title, showToday;
  $('.head').classList.toggle('tg-mode', ui.view === 'together');
  if (ui.view === 'together') {
    title = 'Together'; showToday = false;
  } else if (ui.view === 'week') {
    const s = weekStartOf(ui.anchor), e = addDays(s, 6), a = pd(s), b = pd(e);
    title = a.getMonth() === b.getMonth()
      ? `${MON[a.getMonth()]} ${a.getDate()} – ${b.getDate()}`
      : `${MON[a.getMonth()]} ${a.getDate()} – ${MON[b.getMonth()]} ${b.getDate()}`;
    if (b.getFullYear() !== nowY) title += `<small>${b.getFullYear()}</small>`;
    showToday = today < s || today > e;
  } else {
    const a = pd(ui.anchor);
    title = MON_LONG[a.getMonth()] + (a.getFullYear() !== nowY ? `<small>${a.getFullYear()}</small>` : '');
    showToday = today.slice(0, 7) !== ui.anchor.slice(0, 7);
  }
  $('#title').innerHTML = title;
  $('#todayBtn').hidden = !showToday;
  fitTitle();
  document.querySelectorAll('.seg [data-act="view"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === ui.view)));
}

function evHTML(e, date) {
  return `<div class="ev" data-ev="${e.id}" data-occ="${date}">
    <span class="ev-title">${esc(e.title)}${isRepeat(e) ? `<span class="rep" aria-label="Repeats">${ICON.repeat}</span>` : ''}</span>
    ${evTime(e) ? `<span class="ev-meta">${evTime(e)}</span>` : ''}
    ${e.notes ? `<span class="ev-notes">${esc(e.notes)}</span>` : ''}
  </div>`;
}

function weekHTML() {
  const today = todayStr(), start = weekStartOf(ui.anchor), hasTypes = db.shiftTypes.length > 0;
  let h = '';
  if (!hasTypes && !db.events.length) {
    h += `<div class="hello glass"><h2>Set up your shifts</h2>
      <p>Make each of your usual shifts once. After that, adding your schedule is just tapping the days you work.</p>
      <button class="btn primary" data-act="shifts">Make a shift</button>
      ${sync.code ? '' : '<button class="btn quiet" data-act="backup" style="margin-left:8px">I have a passcode</button>'}</div>`;
  }
  h += '<div class="week">';
  for (let i = 0; i < 7; i++) {
    const date = addDays(start, i), d = pd(date), t = shiftOn(date), evs = eventsOn(date);
    h += `<div class="day ${t ? 'work' : 'off'}${date === today ? ' today' : ''}${date < today ? ' past' : ''}" data-date="${date}" role="button" tabindex="0"${t ? ` style="--c:${t.color}"` : ''}
      aria-label="${DOW_LONG[d.getDay()]} ${MON_LONG[d.getMonth()]} ${d.getDate()}">
      <div class="day-date"><span class="dow">${DOW[d.getDay()]}</span><span class="num">${d.getDate()}</span></div>
      <div class="day-body">
        ${t ? `<div class="shift"><span class="shift-name">${esc(t.name)}</span><span class="shift-time">${shiftRange(t)}</span></div>`
            : (evs.length ? '' : `<div class="off-label">${hasTypes && pref('calendar').showOff ? 'Off' : ''}</div>`)}
        ${evs.map(e => evHTML(e, date)).join('')}
      </div></div>`;
  }
  h += '</div>';

  // Coming up: the next few events after this week (only while looking at the current week)
  const end = addDays(start, 6);
  const upN = pref('calendar').comingUp;
  if (upN && today >= start && today <= end && db.events.length) {
    const up = [], seen = new Set();   // a repeating event is listed once, at its next date
    for (let i = 1; i <= 60 && up.length < upN; i++) {
      const date = addDays(end, i);
      for (const e of eventsOn(date)) { if (up.length < upN && !seen.has(e.id)) { seen.add(e.id); up.push([date, e]); } }
    }
    if (up.length) {
      h += '<section class="next"><h2>Coming up</h2>' + up.map(([date, e]) => {
        const d = pd(date);
        return `<div class="next-row" data-ev="${e.id}" data-occ="${date}"><span>${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}</span><b>${esc(e.title)} <i>${e.all_day ? '' : fmtTime(e.start_time)}</i></b></div>`;
      }).join('') + '</section>';
    }
  }
  return h;
}

function monthHTML() {
  const today = todayStr(), a = pd(ui.anchor), y = a.getFullYear(), m = a.getMonth();
  const first = ds(new Date(y, m, 1)), last = ds(new Date(y, m + 1, 0));
  const gridStart = weekStartOf(first);
  const weeks = Math.ceil((dayDiff(gridStart, last) + 1) / 7);
  let h = '<div class="mhead">';
  for (let i = 0; i < 7; i++) h += `<span>${DOW[(db.settings.weekStart + i) % 7]}</span>`;
  h += '</div><div class="mgrid">';
  for (let i = 0; i < weeks * 7; i++) {

function initPresetDrag() {

    const grip = e.target.closest('.grip');
    if (!grip) return;

    let to = from;

    const move = ev => {
      const dy = Math.max(-from * h, Math.min((rows.length - 1 - from) * h, ev.clientY - y0));
      row.style.transform = `translateY(${dy}px)`;
      to = Math.round((from * h + dy) / h);
      rows.forEach((r, i) => {
        if (r === row) return;
        r.style.transform = (i > from && i <= to) ? `translateY(${-h}px)` : (i < from && i >= to) ? `translateY(${h}px)` : '';
      });
    };
    const up = () => {
      grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
      if (to !== from) {
        const types = sortedTypes(), [m] = types.splice(from, 1);
        types.splice(to, 0, m);

    };
    grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
  });
}

/* Together (core v2): when are both people free? Pure functions, no screen code.

   Times are local (both phones are in the same time zone).

     Anything already on a calendar is fixed: work and plan both block their time.
     note = a marker (payday), never busy. work also triggers the night-shift sleep rule.

/* Turns Nova's tables into the shared schedule format both apps speak.
   This exact block lives in api/share.js (what Joe's Glance receives) and in index.html
   (Irina's side of the Together tab), so both always describe her day the same way.
   o = { types, shifts:[{date, shift_type_id}], events, skips:[{event_id, date}], from, to }

  (o.shifts || []).forEach(function (s) {

      var start = s.date + 'T' + st, end = (et <= st ? plus(s.date, 1) : s.date) + 'T' + et;   // end at or before start: ends the next day
      if (overlaps(start, end)) out.push({ title: t.name, start: start, end: end, all_day: false, kind: 'work' });
    } else if (s.date >= from) {
      var mode = t.together || (/pay/i.test(t.name || '') ? 'ignore' : 'work');

/* ───────── Together ─────────

    if (res.status === 401) ans = { ok: false, state: 'passcode' };

`;

    <div class="sheet-head"><h2>${DOW_LONG[d.getDay()]}, ${MON_LONG[d.getMonth()]} ${d.getDate()}</h2><button class="link" data-act="close">Done</button></div>

}

function openTgSettings() { openSettings('together'); }
function tgSet(k, v) {
  const o = tgOpt();
  o[k] = v;
  if (o.h1 - o.h0 < o.minH) { if (k === 'h0') o.h1 = Math.min(24, o.h0 + o.minH); else if (k === 'h1') o.h0 = Math.max(0, o.h1 - o.minH); else o.minH = Math.min(o.minH, o.h1 - o.h0); }

/* ───────── Notifications (this iPhone) ─────────
   Same setup as Volley: the phone subscribes with the browser's push service, the server keeps
   the subscription, and a sweep every 5 minutes sends whatever is due. iPhone only allows this
   from the Home Screen app, and the permission prompt has to come from a tap. */
const NT = { state: 'unknown', busy: false, msg: '' };
const ntSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const ntStandalone = () => navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
function b64ToBytes(s) {
  const pad = '='.repeat((4 - s.length % 4) % 4), raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
async function ntApi(action, extra) {
  const res = await fetch('/api/push', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-nova-passcode': sync.code }, body: JSON.stringify({ action, ...(extra || {}) }) });
  if (res.status === 503) throw Object.assign(new Error('not_setup'), { code: 'not_setup' });
  if (res.status === 401) throw Object.assign(new Error('passcode'), { code: 'passcode' });
  if (!res.ok) throw new Error('push ' + res.status);
  return res.json();
}
async function ntCheck() {
  if (!ntSupported()) NT.state = ntStandalone() ? 'unsupported' : 'browser';
  else if (!sync.code) NT.state = 'nobackup';
  else if (Notification.permission === 'denied') NT.state = 'denied';
  else {
    try {
      const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
      NT.state = sub ? 'on' : 'off';
    } catch (e) { NT.state = 'off'; }
  }
  if (sheetOpen && ctx.kind === 'settings' && (ctx.page === 'notify' || ctx.page === 'home')) openSettings(ctx.page, true);
  return NT.state;
}
async function ntEnable() {
  NT.busy = true; NT.msg = ''; openSettings('notify', true);
  try {
    const perm = await Notification.requestPermission();      // must be the first await, straight from the tap
    if (perm !== 'granted') { NT.state = perm === 'denied' ? 'denied' : 'off'; return; }
    const { publicKey } = await ntApi('key');
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
    await ntApi('subscribe', { sub: sub.toJSON() });
    NT.state = 'on'; NT.msg = 'Notifications are on. Send a test to check.';
  } catch (e) {
    NT.msg = e.code === 'not_setup' ? 'Nova isn’t set up for notifications yet. Joe needs to add the push keys in Vercel.'
      : e.code === 'passcode' ? 'Your backup passcode isn’t working.' : 'Couldn’t turn on notifications. Check your connection and try again.';
  } finally { NT.busy = false; openSettings('notify', true); }
}
async function ntDisable() {
  NT.busy = true; openSettings('notify', true);
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (sub) { try { await ntApi('unsubscribe', { endpoint: sub.endpoint }); } catch (e) {} await sub.unsubscribe(); }
    NT.state = 'off'; NT.msg = 'Notifications are off on this iPhone.';
  } catch (e) { NT.msg = 'Couldn’t turn them off. Try again.'; }
  finally { NT.busy = false; openSettings('notify', true); }
}
async function ntTest() {
  NT.busy = true; NT.msg = ''; openSettings('notify', true);
  try {
    const r = await ntApi('test');
    NT.msg = r.sent ? 'Test sent. It should show up in a few seconds.' : 'No iPhones are signed up yet. Turn notifications on first.';
  } catch (e) { NT.msg = e.code === 'not_setup' ? 'Nova isn’t set up for notifications yet.' : 'Couldn’t send the test. Try again.'; }
  finally { NT.busy = false; openSettings('notify', true); }
}

/* In-app banner, for pushes that arrive while Nova is open (and for small confirmations) */
let toastTimer = null;
function toast(title, body) {
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); el.addEventListener('click', () => el.classList.remove('show')); }
  el.innerHTML = `<span class="toast-icon">${ICON.bell}</span><span class="toast-text"><b>${esc(title)}</b>${body ? `<span>${esc(body)}</span>` : ''}</span>`;
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 4500);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => {
  if (e.data && e.data.type === 'nova-push') toast(e.data.title, e.data.body);
});

      return `<p class="intro">Backup keeps a copy of the calendar safe, so it comes back if the app is ever removed from this phone. Together and notifications use it too.</p>
        <div class="group">
          <div class="row" id="r-code"><label for="b-code">Passcode</label><input id="b-code" type="text" value="${esc(sync.code)}" placeholder="Enter passcode" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></div>
        </div>
        <p class="hint" id="b-msg">${sync.code ? 'Status: ' + backupLabel() + (sync.at ? `. Last backed up ${tgAgo(sync.at)}.` : '.') : ''}</p>
        <div class="actions">
          <button class="btn primary wide" data-act="backup-save">${sync.code ? 'Save passcode' : 'Turn on backup'}</button>
          ${sync.code ? '<button class="btn danger wide" data-act="backup-off">Turn off backup on this phone</button>' : ''}
        </div>`;

    case 'data': {
      const nShifts = Object.keys(db.shifts).length, nPlans = db.events.length;
      return `<div class="group">
          <div class="row"><span class="lbl">Days with a shift</span><span class="row-val">${nShifts}</span></div>
          <div class="row"><span class="lbl">Plans and day notes</span><span class="row-val">${nPlans}</span></div>
          <div class="row"><span class="lbl">Kinds of shifts</span><span class="row-val">${db.shiftTypes.length}</span></div>
        </div>
        <div class="actions">
          <button class="btn quiet wide" data-act="data-export">Save a copy</button>
          <button class="btn danger wide" data-act="data-erase">Erase this phone</button>
        </div>
        <p class="hint">Save a copy makes a file of everything, for safekeeping. Erase this phone clears Nova from this iPhone only. Your backup isn’t touched, so entering the passcode again brings everything back.</p>`;
    }

    case 'about':
      return `<div class="group">
          <div class="row"><span class="lbl">Version</span><span class="row-val">${NOVA_VERSION}</span></div>
          <div class="row"><span class="lbl">Made for</span><span class="row-val">Irina</span></div>
        </div>
        <div class="actions"><button class="btn quiet wide" data-act="app-update">Check for updates</button></div>
        <p class="hint">Nova updates itself in the background. If something looks out of date, Check for updates loads the newest version now.</p>`;
  }
  return '';
}

function settingsChange(el) {
  const [sec, k] = el.dataset.pref.split('.');
  const def = PREF_DEF[sec][k];
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (typeof def === 'number') v = Number(v);
  if (sec === 'share' && k === 'prefix') v = String(v).trim().slice(0, 24) || 'Work';
  if (el.type === 'time' && !v) return openSettings(ctx.page, true);   // cleared a time: keep the old one
  setPref(sec, k, v);
  render();
  openSettings(ctx.page, true);
}
function settingsPick(key, raw) {
  const [sec, k] = key.split('.');
  const def = PREF_DEF[sec][k];
  setPref(sec, k, typeof def === 'number' ? Number(raw) : typeof def === 'boolean' ? raw === 'true' : raw);
  render();
  openSettings(ctx.page, true);
}

function exportData() {
  const copy = { app: 'nova', version: NOVA_VERSION, saved: new Date().toISOString(), shiftTypes: db.shiftTypes, shifts: db.shifts, events: db.events, skips: db.skips, settings: db.settings };
  const name = `Nova copy ${todayStr()}.json`, blob = new Blob([JSON.stringify(copy, null, 2)], { type: 'application/json' });
  let file = null;
  try { file = new File([blob], name, { type: 'application/json' }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function eraseData() {
  const ok = await ask(sync.code ? 'Clear Nova from this iPhone? Your backup stays, and the passcode brings it back.' : 'Backup is off, so this deletes everything for good.', [{ label: 'Erase this phone', value: true, danger: true }]);
  if (!ok) return;
  try { if (ntSupported()) { const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription(); if (sub) { try { await ntApi('unsubscribe', { endpoint: sub.endpoint }); } catch (e) {} await sub.unsubscribe(); } } } catch (e) {}
  try { ['nova:v1', 'nova:sync', 'nova:together'].forEach(k => localStorage.removeItem(k)); } catch (e) {}
  location.reload();
}
async function appUpdate() {
  try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); } catch (e) {}
  location.reload();
}

/* ───────── Navigation ───────── */
function step(dir) {
  if (ui.view === 'together') return;
  if (ui.view === 'week') ui.anchor = addDays(ui.anchor, 7 * dir);
  else { const a = pd(ui.anchor); ui.anchor = ds(new Date(a.getFullYear(), a.getMonth() + dir, 1)); }
  render(dir);
  $('main').scrollTop = 0;
}
function goToday() {
  const t = todayStr(), dir = t > ui.anchor ? 1 : -1;
  ui.anchor = t; render(dir); $('main').scrollTop = 0;
}
function setView(v) {
  if (v === ui.view) return;
  // coming back from a month you browsed to: land on today if it's in that month, else its first week
  if (v === 'week' && ui.anchor.slice(0, 7) === todayStr().slice(0, 7)) ui.anchor = todayStr();
  ui.view = v; db.settings.view = v; save(); render(); $('main').scrollTop = 0;
  tgMaybeFetch();
}

/* ───────── Input wiring ───────── */
document.addEventListener('click', e => {
  const actEl = e.target.closest('[data-act]');
  if (actEl) {
    const d = actEl.dataset;
    switch (d.act) {
      case 'view': setView(d.v); break;
      case 'prev': step(-1); break;
      case 'next': step(1); break;
      case 'today': goToday(); break;
      case 'jump': if (ui.view !== 'together') openJump(); break;
      case 'jump-year': openJump(Number(d.y)); break;
      case 'jump-month': jumpTo(ctx.year, Number(d.m)); break;
      case 'jump-today': closeSheet(); goToday(); break;
      case 'paint': startPaint(); break;
      case 'paint-pick': ui.paint.id = d.id; ui.lastPaint = d.id; renderDock(); break;
      case 'paint-undo': undoPaint(); break;
      case 'paint-done': finishPaint(); break;
      case 'paint-back': $('#review').hidden = true; break;
      case 'paint-confirm': confirmPaint(); break;
      case 'share': if (ui.view !== 'together') openShare(); break;
      case 'sh-opt': SH.opt[d.k] = d.v === 'true' ? true : d.v === 'false' ? false : d.v; renderShare(); break;
      case 'sh-go': shareGo(); break;
      case 'settings': ui.paint = null; render(); openSettings(d.page || 'home'); break;
      case 'pref': settingsPick(d.k, d.v); break;
      case 'nt-on': ntEnable(); break;
      case 'nt-off': ntDisable(); break;
      case 'nt-test': ntTest(); break;
      case 'data-export': exportData(); break;
      case 'data-erase': eraseData(); break;
      case 'app-update': appUpdate(); break;
      case 'tg-refresh': tgFetch(); break;
      case 'tg-settings': openSettings('together'); break;
      case 'tg-set': tgSet(d.k, Number(d.v)); break;
      case 'tg-type': { const t = typeById(d.id); if (t) { t.together = d.v; save(); render(); openSettings('together', true); } break; }
      case 'shift-tg': ctx.tg = d.v; sheet.querySelectorAll('[data-act="shift-tg"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === d.v))); break;
      case 'add-event': openEvent(null, null, d.date || null); break;
      case 'shifts': ui.paint = null; render(); openShifts(); break;
      case 'close': closeSheet(); break;
      case 'cancel-form': if (ctx.back) openDay(ctx.back); else closeSheet(); break;
      case 'save-event': saveEvent(); break;
      case 'delete-event': deleteEvent(); break;
      case 'day-shift': if (d.id) db.shifts[ctx.date] = d.id; else delete db.shifts[ctx.date]; save(); render(); openDay(ctx.date); break;
      case 'edit-shift': openShiftForm(d.id || null); break;
      case 'save-shift': saveShift(); break;
      case 'delete-shift': deleteShift(); break;
      case 'pick-color': ctx.color = d.c; sheet.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', String(s.dataset.c === d.c))); break;
      case 'backup': openSettings('backup'); break;
      case 'backup-save': saveBackup(); break;
      case 'backup-off': backupOff(); break;
      case 'week-start': db.settings.weekStart = Number(d.v); save(); render(); openSettings('calendar', true); break;
    }
    return;
  }
  const tgEl = e.target.closest('[data-tg-day]');
  if (tgEl) { openTgDay(tgEl.dataset.tgDay); return; }
  const dayEl = e.target.closest('#view [data-date]');
  if (dayEl && ui.paint) { paintDay(dayEl.dataset.date); return; }
  const evEl = e.target.closest('[data-ev]');
  if (evEl) { openEvent(evEl.dataset.ev, evEl.dataset.occ); return; }
  if (dayEl) { openDay(dayEl.dataset.date); return; }
});
scrim.addEventListener('click', closeSheet);
sheet.addEventListener('change', e => {
  syncEventForm(); syncShiftForm();
  if (e.target.dataset && e.target.dataset.pref) { settingsChange(e.target); return; }
  const k = e.target.dataset && e.target.dataset.tgset;
  if (k === 'share') { db.settings.shareOn = e.target.checked; save(); openSettings('together', true); }
  else if (k) tgSet(k, Number(e.target.value));
});
sheet.addEventListener('input', e => { const r = e.target.closest('.row.bad'); if (r) r.classList.remove('bad'); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('input[type=text]')) e.target.blur();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.day')) { e.preventDefault(); e.target.click(); }
});

/* swipe left / right to change week or month */
(() => {
  let x0 = 0, y0 = 0, on = false;
  const m = $('main');
  m.addEventListener('touchstart', e => { if (e.touches.length !== 1) { on = false; return; } on = true; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  m.addEventListener('touchend', e => {
    if (!on) return; on = false;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    if (pref('calendar').swipe && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.8) step(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

/* Together: pull down to refresh */
(() => {
  const m = $('main');
  let y0 = null, dy = 0;
  m.addEventListener('touchstart', e => {
    y0 = (ui.view === 'together' && m.scrollTop <= 0 && e.touches.length === 1 && !tg.loading) ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  m.addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    const p = $('#tgPull'); if (!p) return;
    p.classList.toggle('on', dy > 20); p.classList.toggle('ready', dy > 70);
    p.textContent = dy > 70 ? 'Release to refresh' : 'Pull to refresh';
  }, { passive: true });
  m.addEventListener('touchend', () => {
    if (y0 == null) return;
    y0 = null;
    const p = $('#tgPull');
    if (dy > 70) { if (p) p.textContent = 'Updating\u2026'; tgFetch(); } else if (p) p.classList.remove('on', 'ready');
  }, { passive: true });
})();

/* roll over to the new day if the app was left open overnight */
let lastDay = todayStr();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = todayStr();
  if (t !== lastDay) { lastDay = t; if (!sheetOpen) { ui.anchor = t; } render(); }
  queueSync(200);
  tgMaybeFetch();
});

/* ───────── Boot ───────── */
applyPrefs();
render();
const setHeadH = () => document.documentElement.style.setProperty('--head-h', $('.head').offsetHeight + 'px');
setHeadH(); window.addEventListener('resize', setHeadH);
if (sync.code) queueSync(300);
tgMaybeFetch();
window.addEventListener('online', () => queueSync(200));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
